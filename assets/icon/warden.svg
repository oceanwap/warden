<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Warden</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3049"/>
      <stop offset="1" stop-color="#0d0f17"/>
    </linearGradient>
    <linearGradient id="shield" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8b92ff"/>
      <stop offset="0.55" stop-color="#5865f2"/>
      <stop offset="1" stop-color="#3a3fb8"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b52"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9ceff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="led" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- the macOS icon plate: 824 px square on a 1024 px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- shield -->
  <g filter="url(#soft)">
    <path id="outline" d="M512 238 C578 274 654 292 732 294 L732 522 C732 648 636 742 512 800 C388 742 292 648 292 522 L292 294 C370 292 446 274 512 238 Z" fill="url(#shield)"/>
  </g>
  <g transform="translate(512 519) scale(0.9) translate(-512 -519)">
    <path d="M512 238 C578 274 654 292 732 294 L732 522 C732 648 636 742 512 800 C388 742 292 648 292 522 L292 294 C370 292 446 274 512 238 Z" fill="url(#face)"/>
  </g>

  <!-- W: the supervisor's heartbeat -->
  <path d="M384 410 L448 624 L512 466 L576 624 L640 410" fill="none" stroke="url(#mark)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- status light -->
  <circle cx="680" cy="342" r="26" fill="#34d399" filter="url(#led)" opacity="0.9"/>
  <circle cx="680" cy="342" r="19" fill="#4ade80"/>
  <circle cx="673" cy="335" r="6" fill="#ffffff" fill-opacity="0.55"/>
</svg>
