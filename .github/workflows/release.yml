# Release builds. Three products, published side by side:
#   warden-<version>-<os>-<arch>.tar.gz      the CLI: warden, README.md, contrib/
#   warden-gui-<version>-<os>-<arch>.*       the GUI bundled with the CLI: warden-gui, warden,
#                                            README.md, README-GUI.md, contrib/ (.tar.gz on
#                                            Linux, a zipped Warden.app on macOS)
#   warden[-gui]_<version>-1_<arch>.deb, warden[-gui]-<version>-1.<arch>.rpm
#                                            Linux packages (docs/packages.md), amd64/arm64
# plus install.sh, install-gui.sh and SHA256SUMS covering every file, and macos-build-info.txt.
#
# Linux is built, tested and packaged here. The macOS archives have two possible
# sources, chosen per release (`macos_source`, see below), and exactly one of
# the two jobs runs:
#   runner  (the default) the `macos-runner` job builds them here, on a
#           GitHub-hosted macOS runner (standard runners, macOS included, are
#           free for a public repository): scripts/dist-macos.sh --no-upload,
#           which builds, packages and checks everything and sends nothing
#           anywhere, then checks the files again for real (Mach-O architectures,
#           licenses, Info.plist, the .dmg mounted). A dry run builds them too.
#           Ad-hoc signed only; no secrets.
#   local   they are built on the maintainer's Mac (the same script, which
#           `cargo release --macos local` runs after pushing the tag), where
#           Warden.app is signed and the signing certificate stays in that Mac's
#           keychain (no secrets in CI), and uploaded to a DRAFT release for the
#           tag. The `macos-local` job waits for them (up to an hour), refuses
#           any that were built from another commit, and the release is
#           published only with all of them. A dry run has none.
# Every archive carries LICENSE-MIT, LICENSE-APACHE and the third-party notices
# (cargo-about, about.toml): THIRD-PARTY-LICENSES.txt, and
# THIRD-PARTY-LICENSES-GUI.txt in the GUI bundles.
#
# What starts a run (only a pushed tag publishes; nothing else ever does):
#   - a pushed tag v<version> (matching Cargo.toml): the release.
#     `cargo release <version>` does that from a checkout, after checking CI.
#     The macOS source is the line `macos: runner` or `macos: local` in the
#     tag's annotation (a lightweight tag, or no such line, means runner). To
#     retry a failed release, re-run the tag's own run;
#   - Actions > Release > Run workflow, on any branch: a DRY RUN. Everything is
#     built, packaged, checksummed and install-tested exactly as for a release
#     and kept as workflow artifacts (release-<version>: every file, SHA256SUMS
#     included; release-notes: the notes), but no tag is made and no GitHub
#     Release is created or touched. With the macOS source "runner" (the input
#     `macos_source`, default runner) the macOS archives are built and checked
#     too; with "local" none are taken. Use it before tagging, and after
#     changing this file.
# Pushes to branches never start it.
name: Release

on:
  push:
    tags: ["v*"]
  # By hand: a dry run, never a release (a release is a pushed tag).
  workflow_dispatch:
    inputs:
      macos_source:
        description: "Where this dry run's macOS archives are built: runner (a GitHub macOS runner, built and checked) or local (on your Mac: a dry run takes none)"
        type: choice
        options: [runner, local]
        default: runner

permissions:
  contents: read

concurrency:
  # By event too: a dry run started on a tag must not cancel the tag's release.
  group: release-${{ github.ref }}-${{ github.event_name }}
  # A release in progress is never cancelled; a dry run by a newer one is.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  # Linux binaries link glibc 2.28 symbols at most (RHEL 8, Debian 10+), so
  # they keep glibc's malloc and the preadv2 fast path (glibc 2.26+) that CI
  # tests and the benchmarks measure; musl would lose both.
  GLIBC: "2.28"
  ZIG_VERSION: "0.14.1"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_ABOUT_VERSION: "0.9.2"
  # Builds the .deb and .rpm (contrib/nfpm.yaml); installed with `go install`,
  # which checks every module against Go's checksum database.
  NFPM_VERSION: "2.47.0"

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      gui: ${{ steps.gui.outputs.present == 'true' }}
      # runner | local: which of the two macOS jobs runs (the other is skipped)
      macos_source: ${{ steps.macos.outputs.macos_source }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # The whole history, so that every tag is fetched with its annotation:
      # the macOS source is written in the annotation of the tag that was pushed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Version (the tag must match Cargo.toml), and what this run is
        run: |
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if ! [[ "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad version::Cargo.toml says version \"$cargo_version\", which is not X.Y.Z or X.Y.Z-PRERELEASE (the packages and the file names need that)."
            exit 1
          fi
          # A pushed tag is the release (a re-run of its run too); a run by hand is
          # always a dry run, on any ref, a tag included.
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error title=Version mismatch::tag $GITHUB_REF_NAME is version $tag_version but Cargo.toml says $cargo_version. Nothing was built or published. Set [package] version = \"$tag_version\" in Cargo.toml (cargo updates Cargo.lock), commit, and move the tag to that commit; or tag v$cargo_version instead."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Release v$cargo_version"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run for version $cargo_version: artifacts only, no release"
            echo "::notice title=Dry run::version $cargo_version is built, packaged and tested, and kept as workflow artifacts. No tag, no GitHub Release."
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - id: gui
        name: GUI crate present?
        if: hashFiles('gui/Cargo.toml') != ''
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      # Where the macOS archives are built: "runner" (the default) or "local".
      # Run by hand, it is the macos_source input. For a pushed tag it is the
      # line `macos: runner` or `macos: local` in the tag's annotation
      # (`cargo release --macos` writes it); a lightweight tag, or an annotation
      # without that line, means runner. Any other value after `macos:` is an
      # error, so that a typo never builds in the wrong place.
      - id: macos
        name: Where the macOS archives are built (runner or local)
        env:
          INPUT: ${{ inputs.macos_source }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          set -euo pipefail
          chosen=runner
          why="the default"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "${INPUT:-runner}" in
              runner|local) chosen=${INPUT:-runner}; why="the macos_source input" ;;
              *)
                echo "::error title=Bad macos_source::the macos_source input is \"$INPUT\": use runner or local. Nothing was built or published."
                exit 1 ;;
            esac
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            # The checkout may leave the pushed tag as a lightweight one (it can
            # fetch the commit instead of the tag object): fetch the tag again.
            git fetch --quiet --no-tags origin "+refs/tags/$tag:refs/tags/$tag"
            # A lightweight tag has no message of its own (for-each-ref would
            # show the commit's): only an annotated tag is read.
            if [ "$(git for-each-ref --format='%(objecttype)' "refs/tags/$tag")" = tag ]; then
              line=$(git for-each-ref --format='%(contents)' "refs/tags/$tag" | grep -iE '^macos:' | tail -n 1 || true)
              if [ -n "$line" ]; then
                value=$(printf '%s' "${line#*:}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
                case "$value" in
                  runner|local) chosen=$value; why="the line \"$line\" in the annotation of $tag" ;;
                  *)
                    echo "::error title=Bad macos line::the annotation of $tag has the line \"$line\": write \"macos: runner\" or \"macos: local\" (no such line means runner). Nothing was built or published. Re-create the tag with the right line (docs/releasing.md, When something fails)."
                    exit 1 ;;
                esac
              else
                why="no macos line in the annotation of $tag"
              fi
            else
              why="$tag is a lightweight tag, so it has no macos line"
            fi
          fi
          echo "macos_source=$chosen" >> "$GITHUB_OUTPUT"
          if [ "$chosen" = runner ]; then
            echo "::notice title=macOS archives::built on a GitHub macOS runner ($why)."
          elif [ "$PUBLISH" = true ]; then
            echo "::notice title=macOS archives::built on a Mac ($why): the macos-local job waits up to an hour for them. On a Mac with this commit checked out: cargo dist-macos."
          else
            echo "::notice title=macOS archives::from a Mac ($why), so a dry run takes none. Run with macos_source runner to build and check them on a runner."
          fi
      # CHANGELOG.md's section for this version (.github/release-notes.sh says
      # which one it took). Also on a dry run, to read them before publishing.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          bash .github/release-notes.sh "$VERSION" > notes/RELEASE-NOTES.md
          { echo "## Release notes for $VERSION"; echo; cat notes/RELEASE-NOTES.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  # The third-party notices, once for all platforms (about.toml lists the
  # targets). Fails if a dependency uses a license not accepted there.
  licenses:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
          rustflags: ""
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - name: Generate THIRD-PARTY-LICENSES*.txt
        run: |
          mkdir -p notices
          cargo about generate --locked --fail -m Cargo.toml about.hbs -o notices/THIRD-PARTY-LICENSES.txt
          if [ "${{ needs.meta.outputs.gui }}" = true ]; then
            cargo about generate --locked --fail -m gui/Cargo.toml about.hbs -o notices/THIRD-PARTY-LICENSES-GUI.txt
          fi
          head -20 notices/*.txt
          wc -l notices/*.txt
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: notices/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: [meta, licenses]
    name: cli ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: warden-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      BIN: target/${{ matrix.target }}/release/warden
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        run: python -m pip install --disable-pip-version-check "ziglang==$ZIG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
      - name: Build (release profile, stripped)
        run: |
          cargo zigbuild --release --locked --bin warden --target "${{ matrix.target }}.$GLIBC"
          file "$BIN"
          ls -l "$BIN"
      - name: Check the binary
        run: |
          file "$BIN" | grep -q ', stripped' || { echo "::error::$BIN is not stripped"; exit 1; }
          newest=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol version: $newest"
          if [ "$(printf '%s\n%s\n' "$newest" "$GLIBC" | sort -V | tail -1)" != "$GLIBC" ]; then
            echo "::error::$BIN needs glibc $newest, newer than the $GLIBC baseline"; exit 1
          fi
          objdump -T "$BIN" | grep -qw preadv2 || { echo "::error::$BIN lost the preadv2 (RWF_NOWAIT) static-file fast path"; exit 1; }
          got=$("$BIN" --version)
          echo "$got"
          [ "$got" = "warden $VERSION" ] || { echo "::error::$BIN --version says '$got', expected 'warden $VERSION'"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: notices
      - name: Package
        run: |
          mkdir -p "dist/$NAME/contrib"
          cp "$BIN" README.md LICENSE-MIT LICENSE-APACHE notices/THIRD-PARTY-LICENSES.txt "dist/$NAME/"
          cp contrib/warden@.service contrib/wardend.service contrib/99-warden.conf contrib/nginx.conf "dist/$NAME/contrib/"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          tar -tzvf "$NAME.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The GUI and the CLI in one download (skipped if gui/ is ever removed);
  # the binary name is read from gui/Cargo.toml.
  gui:
    needs: [meta, licenses, cli]
    if: needs.meta.outputs.gui == 'true'
    name: gui ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # GUI toolkits link system libraries, so no zig here: an older
          # distro keeps the glibc baseline low (2.35).
          # TODO(runner): GitHub deprecated the Ubuntu 22.04 runners on
          # 2026-09-17 (brownouts in March 2027, gone on 2027-04-17), and
          # 24.04 would raise the baseline to glibc 2.39. Before then, build in
          # a `container: ubuntu:22.04` on the 24.04 runners (docs/releasing.md).
          - { os: linux, arch: x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: warden-gui-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      CLI: warden-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: actions/download-artifact@v8
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
      - name: The CLI from the cli job
        run: '{ tar -xzf "$CLI.tar.gz" && "$CLI/warden" --version; } || true'
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: notices
      # No build dependencies: iced (tiny-skia renderer) links only glibc and
      # libgcc; winit and softbuffer load X11, Wayland and xkbcommon at run
      # time (README.md, Install, lists what a desktop needs).
      - name: Build the GUI
        id: build
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | endswith("/gui/Cargo.toml")) | .name')
          bin=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | endswith("/gui/Cargo.toml")) | .targets[] | select(.kind | index("bin")) | .name' | head -1)
          if [ -z "$pkg" ] || [ -z "$bin" ]; then echo "::error::gui/Cargo.toml has no binary target"; exit 1; fi
          cargo build --release --locked -p "$pkg" --bin "$bin" --target "${{ matrix.target }}"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          ls -l "target/${{ matrix.target }}/release/$bin"
      - name: Check the GUI binary
        run: |
          gui="target/${{ matrix.target }}/release/${{ steps.build.outputs.bin }}"
          file "$gui"
          echo "linked libraries:"; ldd "$gui"
          newest=$(objdump -T "$gui" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol version: $newest"
          if ldd "$gui" | grep -qiE 'libvulkan|libGL|libEGL|libX11|libwayland|libxkbcommon'; then
            echo "::error::$gui links a display library at build time; the release must start without it (they are loaded at run time)"; exit 1
          fi
          # --version answers without a display.
          got=$("$gui" --version)
          echo "$got"
          [ "$got" = "warden-gui $VERSION" ] || { echo "::error::$gui --version says '$got', expected 'warden-gui $VERSION'"; exit 1; }
      - name: Package (.tar.gz)
        run: |
          bin=${{ steps.build.outputs.bin }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/$bin" "$CLI/warden" "$CLI/README.md" "dist/$NAME/"
          cp gui/README.md "dist/$NAME/README-GUI.md"
          cp gui/assets/fonts/LICENSES.txt "dist/$NAME/FONT-LICENSES.txt"
          cp LICENSE-MIT LICENSE-APACHE "$CLI/THIRD-PARTY-LICENSES.txt" notices/THIRD-PARTY-LICENSES-GUI.txt "dist/$NAME/"
          cp -R "$CLI/contrib" "dist/$NAME/"
          # The menu entry and icon: ~/.local/share/applications and ~/.local/share/icons/hicolor/256x256/apps.
          cp assets/warden-gui.desktop "dist/$NAME/"
          cp assets/icon/png/warden-256.png "dist/$NAME/warden.png"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          tar -tzvf "$NAME.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The Linux packages (docs/packages.md): the same binaries as the archives,
  # as .deb and .rpm, built and then installed in containers (Debian, Ubuntu,
  # Fedora, Rocky) by scripts/test-linux-packages.sh. Each architecture runs on
  # its own kind of runner, so the packages run where they were built.
  packages:
    needs: [meta, licenses, cli, gui]
    # The gui job is skipped until gui/ exists.
    if: ${{ !cancelled() && needs.cli.result == 'success' && (needs.gui.result == 'success' || needs.gui.result == 'skipped') }}
    name: packages linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      WITH_GUI: ${{ needs.meta.outputs.gui }}
      ARCH: ${{ matrix.arch }}
      # TODO(owner): a repository variable (Settings > Secrets and variables >
      # Actions > Variables) named WARDEN_PKG_MAINTAINER, "Name <address>", is
      # the Maintainer of the packages; unset, scripts/dist-linux-packages.sh
      # says "Warden authors <https://github.com/oceanwap/warden>".
      WARDEN_PKG_MAINTAINER: ${{ vars.WARDEN_PKG_MAINTAINER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cli-linux-${{ matrix.arch }}
          path: artifacts
      - uses: actions/download-artifact@v8
        if: needs.meta.outputs.gui == 'true'
        with:
          name: gui-linux-${{ matrix.arch }}
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: notices
      # From source, not a prebuilt binary: `go install` checks every module
      # against Go's checksum database. Go is on the runner image.
      - name: Install nfpm
        run: |
          go version
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v$NFPM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the packages
        run: |
          set -euo pipefail
          cli="warden-$VERSION-linux-$ARCH"
          mkdir -p bin pkg
          tar -xzf "artifacts/$cli.tar.gz" -C bin --strip-components=1 "$cli/warden"
          opts=()
          if [ "$WITH_GUI" = true ]; then
            gui="warden-gui-$VERSION-linux-$ARCH"
            tar -xzf "artifacts/$gui.tar.gz" -C bin --strip-components=1 "$gui/warden-gui"
            # The GUI archive carries the CLI too: the very same file.
            tar -xzf "artifacts/$gui.tar.gz" -O "$gui/warden" | cmp - bin/warden
          else
            opts+=(--no-gui)
          fi
          bash scripts/dist-linux-packages.sh --notices notices --out pkg --no-sums "${opts[@]}" bin "$VERSION" "$ARCH"
          ls -l pkg
      # dpkg-deb for the .deb files, rpm for the .rpm ones, desktop-file-validate
      # for the menu entry: the inspection of what is inside.
      - name: Tools for the inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm desktop-file-utils
      # Inspects every package (what it holds, what it must not), then in each
      # image `dpkg -i` / `rpm -i`, warden --version, warden doctor, a reinstall,
      # warden-gui in warden's place and back (apt/dnf, then dpkg/rpm), the
      # removals, and warden-gui alone. --require: no runtime or tool is no pass.
      - name: Inspect and install the packages in containers
        run: bash scripts/test-linux-packages.sh --require --version "$VERSION" pkg
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            pkg/*.deb
            pkg/*.rpm
          if-no-files-found: error
          retention-days: 14

  # The macOS archives, source "local": built on the maintainer's Mac and
  # waiting in a draft release for this tag (scripts/dist-macos.sh uploads
  # them). Only a real release needs them; a dry run has none. The files must
  # have been built from this very commit (macos-build-info.txt), and each is
  # checked to be what its name says. A Linux runner: it only waits and
  # downloads. Skipped when the release chose "runner" (the job below).
  macos-local:
    needs: meta
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.macos_source == 'local'
    name: macOS archives (from the draft release, built on a Mac)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write # a draft release is visible only with write access
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the archives built on a Mac
        run: |
          set -uo pipefail
          # The .dmg files scripts/dist-macos.sh uploads are waited for and
          # checked against macos-build-info.txt like the rest.
          archives=(
            "warden-$VERSION-macos-arm64.tar.gz" "warden-$VERSION-macos-x86_64.tar.gz"
            "warden-gui-$VERSION-macos-arm64.zip" "warden-gui-$VERSION-macos-x86_64.zip"
            "Warden-$VERSION-macos-arm64.dmg" "Warden-$VERSION-macos-x86_64.dmg"
          )
          mkdir -p macos
          why=""
          # A transient API error must not end an hour-long wait: retry, and
          # on failure report it and poll again.
          fetch() { # dest cmd… : the command's output into dest, three tries
            local dest=$1
            shift
            for _ in 1 2 3; do
              if "$@" > "$dest.part"; then mv "$dest.part" "$dest"; return 0; fi
              sleep 5
            done
            rm -f "$dest.part"
            return 1
          }
          asset() { # name release-json: the asset's id
            jq -r --arg f "$1" '[.assets[] | select(.name == $f and .state == "uploaded")][0].id // empty' <<<"$2"
          }
          # 0 when macos/ holds the archives that were built from this commit,
          # each matching the checksum in macos-build-info.txt; else 1 with $why.
          poll() {
            local rel f id built want got missing=""
            fetch macos/.list gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" || { why="GitHub's API did not answer"; return 1; }
            rel=$(jq -c --arg tag "$TAG" '[.[] | select(.draft and .tag_name == $tag)][0] // empty' macos/.list) || { why="unreadable answer from GitHub"; return 1; }
            [ -n "$rel" ] || { why="there is no draft release $TAG yet"; return 1; }
            for f in "${archives[@]}" macos-build-info.txt; do
              [ -n "$(asset "$f" "$rel")" ] || missing="$missing $f"
            done
            [ -z "$missing" ] || { why="the draft release $TAG lacks:$missing"; return 1; }
            id=$(asset macos-build-info.txt "$rel")
            fetch macos/macos-build-info.txt gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" || { why="could not download macos-build-info.txt"; return 1; }
            built=$(sed -n 's/^commit: //p' macos/macos-build-info.txt | head -1)
            [ "$built" = "$GITHUB_SHA" ] || { why="the archives were built from ${built:-an unknown commit}, but this release is $GITHUB_SHA"; return 1; }
            grep -qx 'dirty: no' macos/macos-build-info.txt || { why="the archives were built from a tree with uncommitted changes"; return 1; }
            for f in "${archives[@]}"; do
              id=$(asset "$f" "$rel")
              fetch "macos/$f" gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" || { why="could not download $f"; return 1; }
              want=$(awk -v f="$f" '$1 == "sha256" && $3 == f { print $2 }' macos/macos-build-info.txt)
              got=$(sha256sum "macos/$f" | awk '{ print $1 }')
              if [ -z "$want" ] || [ "$got" != "$want" ]; then why="$f does not match the checksum in macos-build-info.txt (an upload may be in progress)"; return 1; fi
            done
            return 0
          }
          deadline=$((SECONDS + 60 * 60))
          last_said=-1000
          until poll; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=No macOS archives::gave up after an hour: $why. On a Mac with this commit checked out ($GITHUB_SHA), run: scripts/dist-macos.sh (needs gh logged in), then re-run this workflow (Re-run all jobs). Nothing was published. To build them on a GitHub runner instead, release again with macos: runner (docs/releasing.md, When something fails)."
              exit 1
            fi
            if [ $((SECONDS - last_said)) -ge 300 ]; then
              last_said=$SECONDS
              echo "::notice title=Waiting for the macOS archives::$why. Build them on a Mac at commit $GITHUB_SHA: git pull && scripts/dist-macos.sh (or cargo xtask dist-macos). This job waits up to an hour."
              echo "waiting: $why"
            fi
            sleep 30
          done
          rm -f macos/.list
          cat macos/macos-build-info.txt
          ls -l macos
      # Each archive must hold a Mach-O binary of the architecture in its name:
      # the wrong target, or a Linux build, must not go out as a macOS one.
      - name: Check what the archives hold
        run: |
          set -euo pipefail
          cd macos
          # Captured first: `grep -q` in a pipe can end it early (SIGPIPE under pipefail).
          macho() { # file arch
            local what
            what=$(file "$1")
            echo "$what"
            grep -q "Mach-O 64-bit.* $2" <<<"$what"
          }
          for arch in arm64 x86_64; do
            cli="warden-$VERSION-macos-$arch"
            tar -tzf "$cli.tar.gz" > "$cli.list"
            grep -qx "$cli/LICENSE-MIT" "$cli.list" || { echo "::error::$cli.tar.gz has no LICENSE-MIT"; exit 1; }
            tar -xzf "$cli.tar.gz" "$cli/warden"
            macho "$cli/warden" "$arch" || { echo "::error::$cli.tar.gz does not hold a macOS $arch warden"; exit 1; }
            gui="warden-gui-$VERSION-macos-$arch"
            unzip -q -o "$gui.zip" "Warden.app/Contents/MacOS/warden-gui" "Warden.app/Contents/MacOS/warden" "Warden.app/Contents/Info.plist"
            for bin in warden-gui warden; do
              macho "Warden.app/Contents/MacOS/$bin" "$arch" || { echo "::error::$gui.zip: $bin is not a macOS $arch binary"; exit 1; }
            done
            grep -q "<string>$VERSION</string>" Warden.app/Contents/Info.plist ||
              { echo "::error::$gui.zip: Info.plist does not say version $VERSION"; exit 1; }
            rm -rf "$cli" "$cli.list" Warden.app
            # A .dmg cannot be opened on this Linux runner; dist-macos.sh mounted it on the Mac.
            dmg="Warden-$VERSION-macos-$arch.dmg"
            test -s "$dmg" || { echo "::error::$dmg is empty"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos-assets
          path: macos/*
          if-no-files-found: error
          retention-days: 14

  # The macOS archives, source "runner": built here, on a GitHub-hosted macOS
  # runner, by the very script a Mac runs (scripts/dist-macos.sh), with
  # --no-upload: it builds both architectures, packages, mounts the disk
  # images, runs install.sh on the arm64 files, writes macos-build-info.txt, and
  # sends nothing anywhere. The files are then checked again, for real, and kept
  # as the artifact `macos-assets` (what `macos-local` makes from the draft). A
  # dry run builds them too. No `contents: write`: it touches no release.
  # Skipped when the release chose "local" (the job above).
  #
  # macos-15 is an Apple silicon (arm64) image, named like the Linux runners are
  # (`macos-latest` moves to a newer macOS, Xcode and SDK on GitHub's schedule,
  # not when someone has looked at a run, and these binaries are linked against
  # the SDK of whichever image runs). The x86_64 archives are cross-built on it:
  # warden and warden-gui are Rust with system frameworks and no C code (no `cc`
  # in their dependency tree), so Xcode's linker and SDK are all they need;
  # Rosetta is only for running the result (checked below, and said if absent).
  # Ad-hoc signing only. TODO(signing): Developer ID signing and notarization
  # would need the certificate and the notarization credentials as repository
  # secrets here (the steps are in scripts/dist-macos.sh); the "local" source
  # keeps them in the owner's keychain instead.
  macos-runner:
    needs: meta
    if: needs.meta.outputs.macos_source == 'runner'
    name: macOS archives (built on a runner)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
          rustflags: ""
      # Both targets (the script adds them too, which then changes nothing).
      - name: Rust targets of both architectures
        run: rustup target add --toolchain "$RUST_TOOLCHAIN" aarch64-apple-darwin x86_64-apple-darwin
      # From source, as in the `licenses` job: scripts/dist-macos.sh writes the
      # third-party notices of every archive itself.
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - name: The runner (macOS, Xcode, SDK, Rosetta)
        run: |
          sw_vers
          xcodebuild -version
          echo "SDK: $(xcrun --sdk macosx --show-sdk-version), $(xcrun --sdk macosx --show-sdk-path)"
          rustc -vV
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is here: the x86_64 binaries are run as well as built"
          else
            echo "::notice title=No Rosetta::this runner cannot run x86_64 binaries: the x86_64 archives are built and checked (architecture, contents) but not run"
          fi
      # Both architectures: the CLI archives, Warden.app (ad-hoc signed) in the
      # zips and the disk images; refuses a dirty tree. Files: target/dist-macos.
      - name: Build, package and check (scripts/dist-macos.sh --no-upload)
        run: bash scripts/dist-macos.sh --no-upload
      # What the script checked, again, on the files that will be released, with
      # a Mac's own tools: the architecture of every binary (a build for the
      # wrong target must not go out as another), the licenses, the version in
      # Info.plist, the disk images really mounted (read-only, detached in a
      # trap), the programs inside them run, and macos-build-info.txt vouching
      # for exactly these files (as the `macos-local` job demands of a Mac's).
      - name: Check the files for real
        run: |
          set -euo pipefail
          cd target/dist-macos
          scratch=$(mktemp -d)
          mounted=""
          detach() { # the image that is mounted, if any
            [ -n "$mounted" ] || return 0
            local m=$mounted
            mounted=""
            hdiutil detach "$m" >/dev/null 2>&1 || { sleep 2; hdiutil detach -force "$m" >/dev/null 2>&1; } || true
          }
          cleanup() { detach; rm -rf "$scratch"; }
          trap cleanup EXIT
          fail() { echo "::error::$*"; exit 1; }
          rosetta=no
          if arch -x86_64 /usr/bin/true 2>/dev/null; then rosetta=yes; fi

          # A Mach-O 64-bit binary of exactly this architecture. `file` is
          # captured first: `grep -q` in a pipe can end it early (SIGPIPE under pipefail).
          macho() { # file arch
            local what archs
            what=$(file "$1")
            archs=$(lipo -archs "$1")
            echo "$what  (lipo: $archs)"
            grep -q "Mach-O 64-bit.* $2" <<<"$what" && [ "$archs" = "$2" ]
          }
          # What a program says when run (--version answers without a display).
          says() { # arch program expected
            local got
            if [ "$1" = x86_64 ] && [ "$rosetta" = no ]; then echo "not run (no Rosetta): $2"; return 0; fi
            if [ "$1" = x86_64 ]; then got=$(arch -x86_64 "$2" --version) || return 1; else got=$("$2" --version) || return 1; fi
            echo "$got"
            [ "$got" = "$3" ]
          }
          # Warden.app, from a zip or from a mounted disk image.
          check_app() { # arch app label
            local arch=$1 app=$2 label=$3 f key v
            for f in warden-gui warden; do
              macho "$app/Contents/MacOS/$f" "$arch" || fail "$label: $f is not a macOS $arch binary"
            done
            for key in CFBundleShortVersionString CFBundleVersion; do
              v=$(plutil -extract "$key" raw -o - "$app/Contents/Info.plist") || fail "$label: Info.plist has no $key"
              [ "$v" = "$VERSION" ] || fail "$label: Info.plist says $key $v, not $VERSION"
            done
            for f in LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt THIRD-PARTY-LICENSES-GUI.txt FONT-LICENSES.txt; do
              [ -s "$app/Contents/Resources/$f" ] || fail "$label: Warden.app has no $f"
            done
            codesign --verify --deep --strict "$app" || fail "$label: Warden.app fails codesign --verify"
            says "$arch" "$app/Contents/MacOS/warden" "warden $VERSION" || fail "$label: the warden inside does not say 'warden $VERSION'"
            says "$arch" "$app/Contents/MacOS/warden-gui" "warden-gui $VERSION" || fail "$label: the warden-gui inside does not say 'warden-gui $VERSION'"
          }

          # First: macos-build-info.txt vouches for exactly these files, built
          # from this commit (the same demand the `macos-local` job makes of a
          # Mac's files), so that nothing is opened that is not what was built.
          files=()
          for arch in arm64 x86_64; do
            files+=("warden-$VERSION-macos-$arch.tar.gz" "warden-gui-$VERSION-macos-$arch.zip" "Warden-$VERSION-macos-$arch.dmg")
          done
          echo "== macos-build-info.txt"
          cat macos-build-info.txt
          built=$(sed -n 's/^commit: //p' macos-build-info.txt | head -1)
          [ "$built" = "$GITHUB_SHA" ] || fail "macos-build-info.txt says the files were built from ${built:-an unknown commit}, but this run is $GITHUB_SHA"
          grep -qx 'dirty: no' macos-build-info.txt || fail "the files were built from a tree with uncommitted changes"
          for f in "${files[@]}"; do
            want=$(awk -v f="$f" '$1 == "sha256" && $3 == f { print $2 }' macos-build-info.txt)
            got=$(shasum -a 256 "$f" | awk '{ print $1 }')
            if [ -z "$want" ] || [ "$got" != "$want" ]; then fail "$f does not match the checksum in macos-build-info.txt"; fi
          done

          for arch in arm64 x86_64; do
            cli="warden-$VERSION-macos-$arch"
            gui="warden-gui-$VERSION-macos-$arch"
            dmg="Warden-$VERSION-macos-$arch.dmg"
            echo "== $arch: $cli.tar.gz"
            tar -tzf "$cli.tar.gz" > "$scratch/$arch.list"
            for f in warden README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt contrib/nginx.conf; do
              grep -qx "$cli/$f" "$scratch/$arch.list" || fail "$cli.tar.gz has no $f"
            done
            tar -xzf "$cli.tar.gz" -C "$scratch" "$cli/warden"
            macho "$scratch/$cli/warden" "$arch" || fail "$cli.tar.gz does not hold a macOS $arch warden"
            says "$arch" "$scratch/$cli/warden" "warden $VERSION" || fail "$cli.tar.gz: warden does not say 'warden $VERSION'"
            echo "== $arch: $gui.zip"
            ditto -x -k "$gui.zip" "$scratch/zip-$arch"
            check_app "$arch" "$scratch/zip-$arch/Warden.app" "$gui.zip"
            echo "== $arch: $dmg"
            mnt="$scratch/mnt-$arch"
            mkdir -p "$mnt"
            mounted=$mnt
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null || fail "$dmg cannot be mounted"
            check_app "$arch" "$mnt/Warden.app" "$dmg"
            { [ -L "$mnt/Applications" ] && [ "$(readlink "$mnt/Applications")" = /Applications ]; } ||
              fail "$dmg: there is no Applications link to /Applications"
            detach
          done

          ls -l
          { echo "### macOS archives, built on a runner"; echo; echo '```'; cat macos-build-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Only the release's files (not the notices folder the script leaves).
      - uses: actions/upload-artifact@v7
        with:
          name: macos-assets
          path: |
            target/dist-macos/warden-*-macos-*.tar.gz
            target/dist-macos/warden-gui-*-macos-*.zip
            target/dist-macos/Warden-*-macos-*.dmg
            target/dist-macos/macos-build-info.txt
          if-no-files-found: error
          retention-days: 14

  checksums:
    needs: [meta, cli, gui, packages, macos-local, macos-runner]
    # The gui job is skipped until gui/ exists. Of the two macOS jobs the
    # release's macos_source picks one; the other is skipped by its own
    # condition, which is as it should be. The chosen one must have succeeded
    # (failed, cancelled, or skipped for any other reason: nothing goes on).
    # The one more legitimate skip: a dry run that chose "local" has no macOS
    # job at all.
    if: >-
      ${{ !cancelled()
      && needs.cli.result == 'success'
      && (needs.gui.result == 'success' || needs.gui.result == 'skipped')
      && needs.packages.result == 'success'
      && ((needs.meta.outputs.macos_source == 'runner' && needs.macos-runner.result == 'success')
      || (needs.meta.outputs.macos_source == 'local' && needs.meta.outputs.publish == 'true' && needs.macos-local.result == 'success')
      || (needs.meta.outputs.macos_source == 'local' && needs.meta.outputs.publish != 'true' && needs.macos-local.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      MACOS_SOURCE: ${{ needs.meta.outputs.macos_source }}
      WITH_GUI: ${{ needs.meta.outputs.gui }}
    steps:
      - uses: actions/checkout@v7
      # macos-assets, from whichever macOS job ran.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{cli,gui,packages,macos}-*"
          path: dist
          merge-multiple: true
      # A job that silently produced fewer files must not make a smaller
      # release: the list of what a release holds is written out here.
      - name: Every file a release needs is there
        run: |
          set -euo pipefail
          want=()
          for a in x86_64 arm64; do
            want+=("warden-$VERSION-linux-$a.tar.gz")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-linux-$a.tar.gz"); fi
          done
          # The packages (revision 1, as scripts/dist-linux-packages.sh names them).
          for a in amd64 arm64; do
            want+=("warden_$VERSION-1_$a.deb")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui_$VERSION-1_$a.deb"); fi
          done
          for a in x86_64 aarch64; do
            want+=("warden-$VERSION-1.$a.rpm")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-1.$a.rpm"); fi
          done
          if [ "$MACOS_SOURCE" = runner ] || [ "$PUBLISH" = true ]; then
            # Built on a runner (always, a dry run too), or taken from the
            # draft a Mac filled (a real release only: a dry run has none).
            for a in arm64 x86_64; do
              want+=("warden-$VERSION-macos-$a.tar.gz")
              want+=("Warden-$VERSION-macos-$a.dmg")
              if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-macos-$a.zip"); fi
            done
            want+=(macos-build-info.txt)
          fi
          missing=0
          for f in "${want[@]}"; do
            [ -f "dist/$f" ] || { echo "::error title=Missing file::$f is not among the build outputs"; missing=1; }
          done
          have=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          extra=$(comm -13 <(printf '%s\n' "${want[@]}" | sort) - <<<"$have")
          if [ -n "$extra" ]; then echo "::warning title=Unlisted files::not in the list of a release (add them to this step, or find out why they are here): ${extra//$'\n'/ }"; fi
          exit $missing
      - name: SHA256SUMS
        run: |
          cp install.sh install-gui.sh dist/
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # install.sh against these very files, served locally: user and root
  # installs, pinned and latest, and a tampered archive that must be refused.
  install-test:
    needs: [meta, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    name: install.sh on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: shellcheck install.sh install-gui.sh
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist
      - name: Serve the release files
        run: |
          cp -R dist tampered
          for f in tampered/*.tar.gz; do printf 'x' >> "$f"; done
          (python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &)
          (python3 -m http.server 8766 --bind 127.0.0.1 --directory tampered > /dev/null 2>&1 &)
          for _ in $(seq 50); do curl -fs "$URL/SHA256SUMS" > /dev/null && curl -fs http://127.0.0.1:8766/SHA256SUMS > /dev/null && exit 0; sleep 0.2; done
          exit 1
      - name: Latest release, as a user (~/.local/bin)
        run: |
          WARDEN_DOWNLOAD_URL="$URL" sh install.sh
          test "$("$HOME/.local/bin/warden" --version)" = "warden $VERSION"
      - name: Pinned version, as root (/usr/local/bin)
        run: |
          sudo env WARDEN_DOWNLOAD_URL="$URL" WARDEN_VERSION="v$VERSION" sh install.sh
          test "$(/usr/local/bin/warden --version)" = "warden $VERSION"
          ls -l /usr/local/bin/warden
      - name: A tampered archive is refused
        run: |
          if WARDEN_DOWNLOAD_URL=http://127.0.0.1:8766 WARDEN_INSTALL_DIR="$RUNNER_TEMP/tampered" sh install.sh; then
            echo "::error::install.sh installed an archive whose checksum does not match"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/tampered/warden"
      - name: scripts/test-install.sh (the install.sh being released, against fake releases)
        run: INSTALL_SH="$PWD/dist/install.sh" INSTALL_GUI_SH="$PWD/dist/install-gui.sh" bash scripts/test-install.sh

  # The macOS archives are in the artifacts either way (macos-assets). With the
  # source "local" the draft release already holds them (macos-local read them
  # there); with "runner" there is no draft yet and it is made here. Add the
  # Linux archives and packages, SHA256SUMS and install.sh, check the draft,
  # write the notes (CHANGELOG.md) and publish it, for the pushed tag that was
  # built (a run by hand is a dry run and never gets here).
  # The only job besides `macos-local` that can write. It does not list the
  # macOS jobs: it needs `checksums`, which runs only when the one the release
  # chose has succeeded. `!cancelled()` and the results it needs, spelled out:
  # without a status function a job is skipped when any job upstream of it
  # was, even with everything it needs passed, and one of the two macOS jobs
  # always is (the first real release went through every job but this one).
  publish:
    needs: [meta, checksums, install-test]
    if: >-
      ${{ !cancelled()
      && needs.meta.outputs.publish == 'true'
      && needs.checksums.result == 'success'
      && needs.install-test.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      # A re-run after the release went out must not touch it. With the macOS
      # source "runner" no draft was made before this job: it is made here, empty
      # (the next step puts every file in it). With "local" the Mac made it and
      # the macos-local job read it, so a missing draft is an error.
      - id: draft
        name: Is there a draft to publish? (made here for the source "runner")
        env:
          MACOS_SOURCE: ${{ needs.meta.outputs.macos_source }}
        run: |
          set -euo pipefail
          seen=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>&1) || true
          case "$seen" in
            true|false) draft=$seen ;;
            *"not found"*)
              if [ "$MACOS_SOURCE" != runner ]; then
                echo "::error title=No draft release::there is no release $TAG, and the macOS archives were taken from the draft the Mac made: it was deleted meanwhile. Run scripts/dist-macos.sh on the Mac again, then re-run this workflow."
                exit 1
              fi
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Warden $VERSION" \
                --notes-file notes/RELEASE-NOTES.md
              draft=true ;;
            *)
              echo "::error::can't look for the release $TAG: $seen"
              exit 1 ;;
          esac
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [ "$draft" != true ]; then
            echo "::notice::$TAG is already published: nothing to upload or publish (the last step verifies it)"
          fi
      # Everything, the macOS files too (the draft's copies are replaced by the
      # very bytes SHA256SUMS lists): what is published is what was
      # checksummed, whatever happened to the draft meanwhile.
      - name: Upload to the draft
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      # Before it goes public: the draft holds exactly the files in SHA256SUMS,
      # byte for byte, as GitHub stored them (a renamed or cut upload is caught
      # here, with nothing out yet).
      - name: Check the draft
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          mkdir draft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          cd draft
          sha256sum -c SHA256SUMS || { echo "::error::the draft's files do not match SHA256SUMS"; exit 1; }
          listed=$(wc -l < SHA256SUMS | tr -d ' ')
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d ' ')
          [ "$listed" = "$files" ] || { echo "::error::SHA256SUMS lists $listed files, the draft holds $files besides it (a draft left by an earlier attempt, or by cargo dist-macos, may hold others: delete the draft release and run this again)"; exit 1; }
          echo "all $files files of the draft match SHA256SUMS"
      - name: Publish
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          flags=(--draft=false --title "Warden $VERSION" --notes-file notes/RELEASE-NOTES.md)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease=true); else flags+=(--prerelease=false); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
      # What users download must be what SHA256SUMS lists, file for file.
      - name: Verify what was published
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets \
            --jq '"draft: \(.isDraft)\n\(.url)\n" + ([.assets[] | "  \(.name) \(.size)"] | join("\n"))'
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = false ] || { echo "::error::$TAG is still a draft"; exit 1; }
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          cd verify
          sha256sum -c SHA256SUMS || { echo "::error::the published files do not match SHA256SUMS"; exit 1; }
          listed=$(wc -l < SHA256SUMS | tr -d ' ')
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d ' ')
          [ "$listed" = "$files" ] || { echo "::error::SHA256SUMS lists $listed files, the release holds $files besides it"; exit 1; }
          echo "all $files published files match SHA256SUMS"
