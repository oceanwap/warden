# Release builds. Three products, published side by side:
#   warden-<version>-<os>-<arch>.tar.gz      the CLI: warden, README.md, contrib/
#   warden-gui-<version>-<os>-<arch>.*       the GUI bundled with the CLI: warden-gui, warden,
#                                            README.md, README-GUI.md, contrib/ (.tar.gz on
#                                            Linux, a zipped Warden.app on macOS)
#   warden[-gui]_<version>-1_<arch>.deb, warden[-gui]-<version>-1.<arch>.rpm
#                                            Linux packages (docs/packages.md), amd64/arm64
# plus install.sh and SHA256SUMS covering every file, and macos-build-info.txt.
#
# Linux is built, tested and packaged here. macOS is NOT: the macOS archives are
# built on the maintainer's Mac (scripts/dist-macos.sh, which `cargo release`
# runs after pushing the tag), where Warden.app is signed and the signing
# certificate stays in that Mac's keychain (no secrets in CI), and uploaded to
# a DRAFT release for the tag. The `macos` job waits for them (up to an hour),
# refuses any that were built from another commit, and the release is
# published only with all of them. (Standard GitHub-hosted runners, macOS
# included, are free for a public repository, so building them here is an
# option: docs/releasing.md says what that would change.) Every archive
# carries LICENSE-MIT, LICENSE-APACHE and the third-party notices
# (cargo-about, about.toml): THIRD-PARTY-LICENSES.txt, and
# THIRD-PARTY-LICENSES-GUI.txt in the GUI bundles.
#
# What starts a run:
#   - a pushed tag v<version> (matching Cargo.toml): the real release.
#     `cargo release <version>` does that from a checkout;
#   - Actions > Release > Run workflow, on any branch, with "Publish the
#     release" UNTICKED (the default): a DRY RUN. Everything is built, packaged,
#     checksummed and install-tested exactly as for a release and kept as
#     workflow artifacts (release-<version>: every file, SHA256SUMS included;
#     release-notes: the notes), but no macOS archives are taken, no tag is
#     made and no GitHub Release is created or touched. Use it before tagging,
#     and after changing this file;
#   - the same, on `main`, with "Publish the release" TICKED: no checkout at
#     all. The tag v<version> is created at that commit once everything is
#     built and tested, so a failed build leaves no tag behind. Needs a green
#     CI run on the commit (see docs/releasing.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the release (main only: tags v<Cargo.toml version> at this commit). Unticked: a dry run, nothing is published."
        type: boolean
        default: false
      skip_ci_check:
        description: "Publish even without a green CI run on this commit (not recommended)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # By mode too: a dry run on main must not cancel a real release waiting there.
  group: release-${{ github.ref }}-${{ inputs.release && 'publish' || 'dry' }}
  # A release in progress is never cancelled by another run.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  # Linux binaries link glibc 2.28 symbols at most (RHEL 8, Debian 10+), so
  # they keep glibc's malloc and the preadv2 fast path (glibc 2.26+) that CI
  # tests and the benchmarks measure; musl would lose both.
  GLIBC: "2.28"
  ZIG_VERSION: "0.14.1"
  CARGO_ZIGBUILD_VERSION: "0.23.4"
  CARGO_ABOUT_VERSION: "0.9.2"
  # Builds the .deb and .rpm (contrib/nfpm.yaml); installed with `go install`,
  # which checks every module against Go's checksum database.
  NFPM_VERSION: "2.47.0"

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the CI runs of this commit, for a release started by hand
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      gui: ${{ steps.gui.outputs.present == 'true' }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: ${{ inputs.release }}
      SKIP_CI_CHECK: ${{ inputs.skip_ci_check }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Version (the tag must match Cargo.toml), and what this run is
        run: |
          cargo_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if ! [[ "$cargo_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Bad version::Cargo.toml says version \"$cargo_version\", which is not X.Y.Z or X.Y.Z-PRERELEASE (the packages and the file names need that)."
            exit 1
          fi
          # A pushed tag is the release. Run by hand, only "Publish the release"
          # releases (even on a tag: re-run a tag's own run to retry it).
          if [ "$GITHUB_EVENT_NAME" = push ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "$tag_version" != "$cargo_version" ]; then
              echo "::error title=Version mismatch::tag $GITHUB_REF_NAME is version $tag_version but Cargo.toml says $cargo_version. Nothing was built or published. Set [package] version = \"$tag_version\" in Cargo.toml (cargo updates Cargo.lock), commit, and move the tag to that commit; or tag v$cargo_version instead."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Release v$cargo_version"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$RELEASE" = "true" ]; then
            # Started by hand with "Publish the release" ticked. Everything that
            # `cargo release` checks before it tags, checked here, before the
            # slow builds.
            tag="v$cargo_version"
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error title=Not on main::a release is cut from main, and this run is on $GITHUB_REF. Nothing was built or published. Run the workflow again and choose the branch main (or untick \"Publish the release\" for a dry run)."
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "::error title=Tag exists::$tag already exists in $GITHUB_REPOSITORY, so version $cargo_version was released before. Nothing was built or published. Raise [package] version in Cargo.toml, Cargo.lock, protocol/Cargo.toml and gui/Cargo.toml (all the same number), commit it to main, let CI pass, and run this again."
              exit 1
            fi
            if [ "$SKIP_CI_CHECK" = "true" ]; then
              echo "::warning title=CI check skipped::publishing $tag without looking for a green CI run on $GITHUB_SHA"
            else
              green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
                --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
              if [ "${green:-0}" -lt 1 ]; then
                echo "::error title=No green CI run::the CI workflow has no passed run on $GITHUB_SHA. Nothing was built or published. Wait for CI to pass on this commit (Actions > CI), or run this again with \"Publish even without a green CI run\" ticked if you are sure."
                exit 1
              fi
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Release $tag at $GITHUB_SHA"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Dry run for version $cargo_version: artifacts only, no release"
            echo "::notice title=Dry run::version $cargo_version is built, packaged and tested, and kept as workflow artifacts. No tag, no GitHub Release."
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
      - id: gui
        name: GUI crate present?
        if: hashFiles('gui/Cargo.toml') != ''
        run: echo "present=true" >> "$GITHUB_OUTPUT"
      # CHANGELOG.md's section for this version (.github/release-notes.sh says
      # which one it took). Also on a dry run, to read them before publishing.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          bash .github/release-notes.sh "$VERSION" > notes/RELEASE-NOTES.md
          { echo "## Release notes for $VERSION"; echo; cat notes/RELEASE-NOTES.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

  # The third-party notices, once for all platforms (about.toml lists the
  # targets). Fails if a dependency uses a license not accepted there.
  licenses:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
          rustflags: ""
      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION"
      - name: Generate THIRD-PARTY-LICENSES*.txt
        run: |
          mkdir -p notices
          cargo about generate --locked --fail -m Cargo.toml about.hbs -o notices/THIRD-PARTY-LICENSES.txt
          if [ "${{ needs.meta.outputs.gui }}" = true ]; then
            cargo about generate --locked --fail -m gui/Cargo.toml about.hbs -o notices/THIRD-PARTY-LICENSES-GUI.txt
          fi
          head -20 notices/*.txt
          wc -l notices/*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: notices/*
          if-no-files-found: error
          retention-days: 14

  cli:
    needs: [meta, licenses]
    name: cli ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: warden-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      BIN: target/${{ matrix.target }}/release/warden
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zig and cargo-zigbuild
        run: python -m pip install --disable-pip-version-check "ziglang==$ZIG_VERSION" "cargo-zigbuild==$CARGO_ZIGBUILD_VERSION"
      - name: Build (release profile, stripped)
        run: |
          cargo zigbuild --release --locked --bin warden --target "${{ matrix.target }}.$GLIBC"
          file "$BIN"
          ls -l "$BIN"
      - name: Check the binary
        run: |
          file "$BIN" | grep -q ', stripped' || { echo "::error::$BIN is not stripped"; exit 1; }
          newest=$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol version: $newest"
          if [ "$(printf '%s\n%s\n' "$newest" "$GLIBC" | sort -V | tail -1)" != "$GLIBC" ]; then
            echo "::error::$BIN needs glibc $newest, newer than the $GLIBC baseline"; exit 1
          fi
          objdump -T "$BIN" | grep -qw preadv2 || { echo "::error::$BIN lost the preadv2 (RWF_NOWAIT) static-file fast path"; exit 1; }
          got=$("$BIN" --version)
          echo "$got"
          [ "$got" = "warden $VERSION" ] || { echo "::error::$BIN --version says '$got', expected 'warden $VERSION'"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: notices
      - name: Package
        run: |
          mkdir -p "dist/$NAME/contrib"
          cp "$BIN" README.md LICENSE-MIT LICENSE-APACHE notices/THIRD-PARTY-LICENSES.txt "dist/$NAME/"
          cp contrib/warden@.service contrib/wardend.service contrib/99-warden.conf contrib/nginx.conf "dist/$NAME/contrib/"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          tar -tzvf "$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The GUI and the CLI in one download (skipped if gui/ is ever removed);
  # the binary name is read from gui/Cargo.toml.
  gui:
    needs: [meta, licenses, cli]
    if: needs.meta.outputs.gui == 'true'
    name: gui ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # GUI toolkits link system libraries, so no zig here: an older
          # distro keeps the glibc baseline low (2.35).
          # TODO(runner): GitHub deprecated the Ubuntu 22.04 runners on
          # 2026-09-17 (brownouts in March 2027, gone on 2027-04-17), and
          # 24.04 would raise the baseline to glibc 2.39. Before then, build in
          # a `container: ubuntu:22.04` on the 24.04 runners (docs/releasing.md).
          - { os: linux, arch: x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      NAME: warden-gui-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      CLI: warden-${{ needs.meta.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ matrix.arch }}
      - name: The CLI from the cli job
        run: tar -xzf "$CLI.tar.gz" && "$CLI/warden" --version || true
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: notices
      # No build dependencies: iced (tiny-skia renderer) links only glibc and
      # libgcc; winit and softbuffer load X11, Wayland and xkbcommon at run
      # time (README.md, Install, lists what a desktop needs).
      - name: Build the GUI
        id: build
        run: |
          pkg=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | endswith("/gui/Cargo.toml")) | .name')
          bin=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.manifest_path | endswith("/gui/Cargo.toml")) | .targets[] | select(.kind | index("bin")) | .name' | head -1)
          [ -n "$pkg" ] && [ -n "$bin" ] || { echo "::error::gui/Cargo.toml has no binary target"; exit 1; }
          cargo build --release --locked -p "$pkg" --bin "$bin" --target "${{ matrix.target }}"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          ls -l "target/${{ matrix.target }}/release/$bin"
      - name: Check the GUI binary
        run: |
          gui="target/${{ matrix.target }}/release/${{ steps.build.outputs.bin }}"
          file "$gui"
          echo "linked libraries:"; ldd "$gui"
          newest=$(objdump -T "$gui" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol version: $newest"
          if ldd "$gui" | grep -qiE 'libvulkan|libGL|libEGL|libX11|libwayland|libxkbcommon'; then
            echo "::error::$gui links a display library at build time; the release must start without it (they are loaded at run time)"; exit 1
          fi
          # --version answers without a display.
          got=$("$gui" --version)
          echo "$got"
          [ "$got" = "warden-gui $VERSION" ] || { echo "::error::$gui --version says '$got', expected 'warden-gui $VERSION'"; exit 1; }
      - name: Package (.tar.gz)
        run: |
          bin=${{ steps.build.outputs.bin }}
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/$bin" "$CLI/warden" "$CLI/README.md" "dist/$NAME/"
          cp gui/README.md "dist/$NAME/README-GUI.md"
          cp gui/assets/fonts/LICENSES.txt "dist/$NAME/FONT-LICENSES.txt"
          cp LICENSE-MIT LICENSE-APACHE "$CLI/THIRD-PARTY-LICENSES.txt" notices/THIRD-PARTY-LICENSES-GUI.txt "dist/$NAME/"
          cp -R "$CLI/contrib" "dist/$NAME/"
          # The menu entry and icon: ~/.local/share/applications and ~/.local/share/icons/hicolor/256x256/apps.
          cp assets/warden-gui.desktop "dist/$NAME/"
          cp assets/icon/png/warden-256.png "dist/$NAME/warden.png"
          tar -C dist -czf "$NAME.tar.gz" "$NAME"
          tar -tzvf "$NAME.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # The Linux packages (docs/packages.md): the same binaries as the archives,
  # as .deb and .rpm, built and then installed in containers (Debian, Ubuntu,
  # Fedora, Rocky) by scripts/test-linux-packages.sh. Each architecture runs on
  # its own kind of runner, so the packages run where they were built.
  packages:
    needs: [meta, licenses, cli, gui]
    # The gui job is skipped until gui/ exists.
    if: ${{ !cancelled() && needs.cli.result == 'success' && (needs.gui.result == 'success' || needs.gui.result == 'skipped') }}
    name: packages linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      WITH_GUI: ${{ needs.meta.outputs.gui }}
      ARCH: ${{ matrix.arch }}
      # TODO(owner): a repository variable (Settings > Secrets and variables >
      # Actions > Variables) named WARDEN_PKG_MAINTAINER, "Name <address>", is
      # the Maintainer of the packages; unset, scripts/dist-linux-packages.sh
      # says "Warden authors <https://github.com/oceanwap/warden>".
      WARDEN_PKG_MAINTAINER: ${{ vars.WARDEN_PKG_MAINTAINER }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: artifacts
      - uses: actions/download-artifact@v4
        if: needs.meta.outputs.gui == 'true'
        with:
          name: gui-linux-${{ matrix.arch }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: licenses
          path: notices
      # From source, not a prebuilt binary: `go install` checks every module
      # against Go's checksum database. Go is on the runner image.
      - name: Install nfpm
        run: |
          go version
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v$NFPM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the packages
        run: |
          set -euo pipefail
          cli="warden-$VERSION-linux-$ARCH"
          mkdir -p bin pkg
          tar -xzf "artifacts/$cli.tar.gz" -C bin --strip-components=1 "$cli/warden"
          opts=()
          if [ "$WITH_GUI" = true ]; then
            gui="warden-gui-$VERSION-linux-$ARCH"
            tar -xzf "artifacts/$gui.tar.gz" -C bin --strip-components=1 "$gui/warden-gui"
            # The GUI archive carries the CLI too: the very same file.
            tar -xzf "artifacts/$gui.tar.gz" -O "$gui/warden" | cmp - bin/warden
          else
            opts+=(--no-gui)
          fi
          bash scripts/dist-linux-packages.sh --notices notices --out pkg --no-sums "${opts[@]}" bin "$VERSION" "$ARCH"
          ls -l pkg
      # dpkg-deb for the .deb files, rpm for the .rpm ones, desktop-file-validate
      # for the menu entry: the inspection of what is inside.
      - name: Tools for the inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends rpm desktop-file-utils
      # Inspects every package (what it holds, what it must not), then in each
      # image `dpkg -i` / `rpm -i`, warden --version, warden doctor, the GUI, a
      # reinstall and the removal. --require: no runtime or tool is no pass.
      - name: Inspect and install the packages in containers
        run: bash scripts/test-linux-packages.sh --require --version "$VERSION" pkg
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            pkg/*.deb
            pkg/*.rpm
          if-no-files-found: error
          retention-days: 14

  # The macOS archives, built on the maintainer's Mac and waiting in a draft
  # release for this tag (scripts/dist-macos.sh uploads them). Only a real
  # release needs them; a dry run has none. The files must have been built from
  # this very commit (macos-build-info.txt), and each is checked to be what its
  # name says. A Linux runner: it only waits and downloads.
  macos:
    needs: meta
    if: needs.meta.outputs.publish == 'true'
    name: macOS archives (from the draft release)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: write # a draft release is visible only with write access
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the archives built on a Mac
        run: |
          set -uo pipefail
          # The .dmg files scripts/dist-macos.sh uploads are waited for and
          # checked against macos-build-info.txt like the rest.
          archives=(
            "warden-$VERSION-macos-arm64.tar.gz" "warden-$VERSION-macos-x86_64.tar.gz"
            "warden-gui-$VERSION-macos-arm64.zip" "warden-gui-$VERSION-macos-x86_64.zip"
            "Warden-$VERSION-macos-arm64.dmg" "Warden-$VERSION-macos-x86_64.dmg"
          )
          mkdir -p macos
          why=""
          # A transient API error must not end an hour-long wait: retry, and
          # on failure report it and poll again.
          fetch() { # dest cmd… : the command's output into dest, three tries
            local dest=$1
            shift
            for _ in 1 2 3; do
              if "$@" > "$dest.part"; then mv "$dest.part" "$dest"; return 0; fi
              sleep 5
            done
            rm -f "$dest.part"
            return 1
          }
          asset() { # name release-json: the asset's id
            jq -r --arg f "$1" '[.assets[] | select(.name == $f and .state == "uploaded")][0].id // empty' <<<"$2"
          }
          # 0 when macos/ holds the archives that were built from this commit,
          # each matching the checksum in macos-build-info.txt; else 1 with $why.
          poll() {
            local rel f id built want got missing=""
            fetch macos/.list gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" || { why="GitHub's API did not answer"; return 1; }
            rel=$(jq -c --arg tag "$TAG" '[.[] | select(.draft and .tag_name == $tag)][0] // empty' macos/.list) || { why="unreadable answer from GitHub"; return 1; }
            [ -n "$rel" ] || { why="there is no draft release $TAG yet"; return 1; }
            for f in "${archives[@]}" macos-build-info.txt; do
              [ -n "$(asset "$f" "$rel")" ] || missing="$missing $f"
            done
            [ -z "$missing" ] || { why="the draft release $TAG lacks:$missing"; return 1; }
            id=$(asset macos-build-info.txt "$rel")
            fetch macos/macos-build-info.txt gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" || { why="could not download macos-build-info.txt"; return 1; }
            built=$(sed -n 's/^commit: //p' macos/macos-build-info.txt | head -1)
            [ "$built" = "$GITHUB_SHA" ] || { why="the archives were built from ${built:-an unknown commit}, but this release is $GITHUB_SHA"; return 1; }
            grep -qx 'dirty: no' macos/macos-build-info.txt || { why="the archives were built from a tree with uncommitted changes"; return 1; }
            for f in "${archives[@]}"; do
              id=$(asset "$f" "$rel")
              fetch "macos/$f" gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" || { why="could not download $f"; return 1; }
              want=$(awk -v f="$f" '$1 == "sha256" && $3 == f { print $2 }' macos/macos-build-info.txt)
              got=$(sha256sum "macos/$f" | awk '{ print $1 }')
              [ -n "$want" ] && [ "$got" = "$want" ] || { why="$f does not match the checksum in macos-build-info.txt (an upload may be in progress)"; return 1; }
            done
            return 0
          }
          deadline=$((SECONDS + 60 * 60))
          last_said=-1000
          until poll; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error title=No macOS archives::gave up after an hour: $why. On a Mac with this commit checked out ($GITHUB_SHA), run: scripts/dist-macos.sh (needs gh logged in), then re-run this workflow (Re-run all jobs). Nothing was published."
              exit 1
            fi
            if [ $((SECONDS - last_said)) -ge 300 ]; then
              last_said=$SECONDS
              echo "::notice title=Waiting for the macOS archives::$why. Build them on a Mac at commit $GITHUB_SHA: git pull && scripts/dist-macos.sh (or cargo xtask dist-macos). This job waits up to an hour."
              echo "waiting: $why"
            fi
            sleep 30
          done
          rm -f macos/.list
          cat macos/macos-build-info.txt
          ls -l macos
      # Each archive must hold a Mach-O binary of the architecture in its name:
      # the wrong target, or a Linux build, must not go out as a macOS one.
      - name: Check what the archives hold
        run: |
          set -euo pipefail
          cd macos
          # Captured first: `grep -q` in a pipe can end it early (SIGPIPE under pipefail).
          macho() { # file arch
            local what
            what=$(file "$1")
            echo "$what"
            grep -q "Mach-O 64-bit.* $2" <<<"$what"
          }
          for arch in arm64 x86_64; do
            cli="warden-$VERSION-macos-$arch"
            tar -tzf "$cli.tar.gz" > "$cli.list"
            grep -qx "$cli/LICENSE-MIT" "$cli.list" || { echo "::error::$cli.tar.gz has no LICENSE-MIT"; exit 1; }
            tar -xzf "$cli.tar.gz" "$cli/warden"
            macho "$cli/warden" "$arch" || { echo "::error::$cli.tar.gz does not hold a macOS $arch warden"; exit 1; }
            gui="warden-gui-$VERSION-macos-$arch"
            unzip -q -o "$gui.zip" "Warden.app/Contents/MacOS/warden-gui" "Warden.app/Contents/MacOS/warden" "Warden.app/Contents/Info.plist"
            for bin in warden-gui warden; do
              macho "Warden.app/Contents/MacOS/$bin" "$arch" || { echo "::error::$gui.zip: $bin is not a macOS $arch binary"; exit 1; }
            done
            grep -q "<string>$VERSION</string>" Warden.app/Contents/Info.plist ||
              { echo "::error::$gui.zip: Info.plist does not say version $VERSION"; exit 1; }
            rm -rf "$cli" "$cli.list" Warden.app
            # A .dmg cannot be opened on this Linux runner; dist-macos.sh mounted it on the Mac.
            dmg="Warden-$VERSION-macos-$arch.dmg"
            test -s "$dmg" || { echo "::error::$dmg is empty"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: macos/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    needs: [meta, cli, gui, packages, macos]
    # The gui job is skipped until gui/ exists, the macos job in a dry run.
    if: ${{ !cancelled() && needs.cli.result == 'success' && (needs.gui.result == 'success' || needs.gui.result == 'skipped') && needs.packages.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      WITH_GUI: ${{ needs.meta.outputs.gui }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: "{cli,gui,packages,macos}-*"
          path: dist
          merge-multiple: true
      # A job that silently produced fewer files must not make a smaller
      # release: the list of what a release holds is written out here.
      - name: Every file a release needs is there
        run: |
          set -euo pipefail
          want=()
          for a in x86_64 arm64; do
            want+=("warden-$VERSION-linux-$a.tar.gz")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-linux-$a.tar.gz"); fi
          done
          # The packages (revision 1, as scripts/dist-linux-packages.sh names them).
          for a in amd64 arm64; do
            want+=("warden_$VERSION-1_$a.deb")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui_$VERSION-1_$a.deb"); fi
          done
          for a in x86_64 aarch64; do
            want+=("warden-$VERSION-1.$a.rpm")
            if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-1.$a.rpm"); fi
          done
          if [ "$PUBLISH" = true ]; then
            # Not in a dry run: they are built on a Mac.
            for a in arm64 x86_64; do
              want+=("warden-$VERSION-macos-$a.tar.gz")
              want+=("Warden-$VERSION-macos-$a.dmg")
              if [ "$WITH_GUI" = true ]; then want+=("warden-gui-$VERSION-macos-$a.zip"); fi
            done
            want+=(macos-build-info.txt)
          fi
          missing=0
          for f in "${want[@]}"; do
            [ -f "dist/$f" ] || { echo "::error title=Missing file::$f is not among the build outputs"; missing=1; }
          done
          have=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          extra=$(comm -13 <(printf '%s\n' "${want[@]}" | sort) - <<<"$have")
          if [ -n "$extra" ]; then echo "::warning title=Unlisted files::not in the list of a release (add them to this step, or find out why they are here): ${extra//$'\n'/ }"; fi
          exit $missing
      - name: SHA256SUMS
        run: |
          cp install.sh dist/
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # install.sh against these very files, served locally: user and root
  # installs, pinned and latest, and a tampered archive that must be refused.
  install-test:
    needs: [meta, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' }}
    name: install.sh on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: shellcheck install.sh
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist
      - name: Serve the release files
        run: |
          cp -R dist tampered
          for f in tampered/*.tar.gz; do printf 'x' >> "$f"; done
          (python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &)
          (python3 -m http.server 8766 --bind 127.0.0.1 --directory tampered > /dev/null 2>&1 &)
          for _ in $(seq 50); do curl -fs "$URL/SHA256SUMS" > /dev/null && curl -fs http://127.0.0.1:8766/SHA256SUMS > /dev/null && exit 0; sleep 0.2; done
          exit 1
      - name: Latest release, as a user (~/.local/bin)
        run: |
          WARDEN_DOWNLOAD_URL="$URL" sh install.sh
          test "$("$HOME/.local/bin/warden" --version)" = "warden $VERSION"
      - name: Pinned version, as root (/usr/local/bin)
        run: |
          sudo env WARDEN_DOWNLOAD_URL="$URL" WARDEN_VERSION="v$VERSION" sh install.sh
          test "$(/usr/local/bin/warden --version)" = "warden $VERSION"
          ls -l /usr/local/bin/warden
      - name: A tampered archive is refused
        run: |
          if WARDEN_DOWNLOAD_URL=http://127.0.0.1:8766 WARDEN_INSTALL_DIR="$RUNNER_TEMP/tampered" sh install.sh; then
            echo "::error::install.sh installed an archive whose checksum does not match"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/tampered/warden"
      - name: scripts/test-install.sh (the install.sh being released, against fake releases)
        run: INSTALL_SH="$PWD/dist/install.sh" bash scripts/test-install.sh

  # The draft release already holds the macOS archives (the macos job read
  # them there): add the Linux archives and packages, SHA256SUMS and
  # install.sh, check the draft, write the notes (CHANGELOG.md) and publish it.
  # A tag pushed by hand is what was built; started by hand, publishing creates
  # the tag at the commit built. The only job besides `macos` that can write.
  publish:
    needs: [meta, checksums, install-test]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TAG: ${{ needs.meta.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.meta.outputs.version }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      # A re-run after the release went out must not touch it.
      - id: draft
        name: Is there a draft to publish?
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [ "$draft" != true ]; then
            echo "::notice::$TAG is already published: nothing to upload or publish (the last step verifies it)"
          fi
      # Everything, the macOS files too (the draft's copies are replaced by the
      # very bytes SHA256SUMS lists): what is published is what was
      # checksummed, whatever happened to the draft meanwhile.
      - name: Upload to the draft
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      # Before it goes public: the draft holds exactly the files in SHA256SUMS,
      # byte for byte, as GitHub stored them (a renamed or cut upload is caught
      # here, with nothing out yet).
      - name: Check the draft
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          mkdir draft
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir draft
          cd draft
          sha256sum -c SHA256SUMS || { echo "::error::the draft's files do not match SHA256SUMS"; exit 1; }
          listed=$(wc -l < SHA256SUMS | tr -d ' ')
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d ' ')
          [ "$listed" = "$files" ] || { echo "::error::SHA256SUMS lists $listed files, the draft holds $files besides it"; exit 1; }
          echo "all $files files of the draft match SHA256SUMS"
      - name: Publish
        if: steps.draft.outputs.draft == 'true'
        run: |
          set -euo pipefail
          flags=(--draft=false --title "Warden $VERSION" --notes-file notes/RELEASE-NOTES.md)
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # Started by hand: publishing creates the tag, at the commit built.
            flags+=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease=true); else flags+=(--prerelease=false); fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
      # What users download must be what SHA256SUMS lists, file for file.
      - name: Verify what was published
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url,assets \
            --jq '"draft: \(.isDraft)\n\(.url)\n" + ([.assets[] | "  \(.name) \(.size)"] | join("\n"))'
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [ "$draft" = false ] || { echo "::error::$TAG is still a draft"; exit 1; }
          mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify
          cd verify
          sha256sum -c SHA256SUMS || { echo "::error::the published files do not match SHA256SUMS"; exit 1; }
          listed=$(wc -l < SHA256SUMS | tr -d ' ')
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d ' ')
          [ "$listed" = "$files" ] || { echo "::error::SHA256SUMS lists $listed files, the release holds $files besides it"; exit 1; }
          echo "all $files published files match SHA256SUMS"
