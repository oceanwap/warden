# `cargo xtask bench` (bench/README.md) on GitHub's hosted Linux runners,
# x86_64 and ARM64: the published numbers come from one 2-CPU x86 VM where
# the load generator shares the CPUs with the apps, while production runs on
# many-core ARM64. Every suite runs (release build of Warden) against PM2,
# Watt, nginx and `serve`. The runners' size depends on the repository's
# plan (4 vCPUs for public repositories, 2 otherwise): the first annotation
# says what the job got.
#
# Results: the job summary (bench/results/latest.md), an artifact with the
# raw JSON, and one notice annotation per suite (readable through the public
# API without a login). docs/benchmarks.md is not touched.
#
# Run it: push to the `bench` branch, or "Run workflow" with the options
# below. CPU pinning (`app_cpus`, `loadgen_cpus`: taskset lists like 0-1 and
# 2-3) and the load generator reach the suites as BENCH_APP_CPUS,
# BENCH_LOADGEN_CPUS and BENCH_LOADGEN (bench/lib.ts); left empty, nothing
# is pinned.
name: Benchmarks

on:
  push:
    branches: [bench]
  workflow_dispatch:
    inputs:
      only:
        description: "Suites, comma-separated (empty: all): node-http, nest-node, bun-http, nest-bun, static, logs, fleet, longlived"
        default: ""
      quick:
        description: "Quick run (3 s per measurement): a smoke test"
        type: boolean
        default: false
      duration:
        description: "Seconds per load measurement (empty: 10)"
        default: ""
      app_cpus:
        description: "Pin the apps and their manager to these CPUs (taskset list, e.g. 0-1; empty: no pinning)"
        default: ""
      loadgen_cpus:
        description: "Pin the load generator to these CPUs (e.g. 2-3; empty: no pinning)"
        default: ""
      loadgen:
        description: "Load generator: oha or wrk"
        default: "oha"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "22"
  OHA_VERSION: "1.16.0"

jobs:
  bench:
    name: bench (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            oha: oha-linux-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            oha: oha-linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            bench/package-lock.json
            bench/nest/package-lock.json
      - name: Install oha, wrk and nginx
        run: |
          sudo curl -fsSL -o /usr/local/bin/oha \
            "https://github.com/hatoo/oha/releases/download/v${OHA_VERSION}/${{ matrix.oha }}"
          sudo chmod 755 /usr/local/bin/oha
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx wrk >/dev/null
          # The suites run their own nginx; the distribution's would only take CPU.
          sudo systemctl disable --now nginx || true
          oha --version && nginx -v && wrk --version | head -1 || true
      - name: npm ci (bench/ and bench/nest/)
        run: |
          (cd bench && npm ci --no-audit --no-fund)
          (cd bench/nest && npm ci --no-audit --no-fund)
      # What `warden startup` sets; without it every manager's rolling restart
      # can reset connections queued on a closing listener.
      - name: net.ipv4.tcp_migrate_req = 1
        run: sudo sysctl -w net.ipv4.tcp_migrate_req=1
      - name: Options
        env:
          IN_APP_CPUS: ${{ inputs.app_cpus }}
          IN_LOADGEN_CPUS: ${{ inputs.loadgen_cpus }}
          IN_LOADGEN: ${{ inputs.loadgen }}
          IN_ONLY: ${{ inputs.only }}
          IN_DURATION: ${{ inputs.duration }}
          IN_QUICK: ${{ inputs.quick }}
        run: |
          args="--no-docs"
          [ "$IN_QUICK" = true ] && args="$args --quick"
          [ -n "$IN_ONLY" ] && args="$args --only $IN_ONLY"
          [ -n "$IN_DURATION" ] && args="$args --duration $IN_DURATION"
          echo "BENCH_ARGS=$args" >> "$GITHUB_ENV"
          # Pinning and the load generator (bench/lib.ts), only when asked for.
          [ -n "$IN_APP_CPUS" ] && echo "BENCH_APP_CPUS=$IN_APP_CPUS" >> "$GITHUB_ENV"
          [ -n "$IN_LOADGEN_CPUS" ] && echo "BENCH_LOADGEN_CPUS=$IN_LOADGEN_CPUS" >> "$GITHUB_ENV"
          [ -n "$IN_LOADGEN" ] && [ "$IN_LOADGEN" != oha ] && echo "BENCH_LOADGEN=$IN_LOADGEN" >> "$GITHUB_ENV"
          echo "cargo xtask bench $args; $(nproc) CPUs: $(lscpu | grep -m1 'Model name' | sed 's/.*: *//')"
          true
      - name: cargo xtask bench
        run: |
          # shellcheck disable=SC2086 # BENCH_ARGS is a list of words
          cargo xtask bench $BENCH_ARGS
      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          { echo "## Benchmarks: ${{ matrix.arch }} (${{ matrix.runner }})"; echo
            cat bench/results/latest.md 2>/dev/null || echo "no results: see the step above"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotation (the runner)
        if: ${{ !cancelled() }}
        run: |
          model=$(LC_ALL=C lscpu | sed -n 's/^Model name: *//p' | head -1)
          mem=$(awk '/MemTotal/ { printf "%.1f GB", $2 / 1048576 }' /proc/meminfo)
          echo "::notice title=bench ${{ matrix.arch }}%3A runner::${{ matrix.runner }}: $(nproc) vCPUs ($model), $mem RAM, $(uname -r)"
      - name: Annotations (one per suite)
        if: ${{ !cancelled() }}
        run: python3 .github/bench-annotations.py "bench ${{ matrix.arch }}" bench/results/latest.md
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}
          path: |
            bench/results/latest.md
            bench/results/latest/*.json
            bench/results/*.json
          if-no-files-found: warn
          retention-days: 30
