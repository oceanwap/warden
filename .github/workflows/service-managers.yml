# `warden startup` / `unstartup` against real service managers, which the
# unit and integration tests only fake (WARDEN_SYSTEMCTL, WARDEN_LAUNCHCTL):
#
# - systemd: GitHub's Ubuntu runners run systemd as PID 1, with passwordless
#   sudo. System units as root, then user units with lingering (the runner
#   user), including a restart of the user manager, the closest to a reboot
#   a runner allows.
# - launchd: GitHub's macOS runners. A LaunchAgent (the runner user), then a
#   LaunchDaemon (sudo).
#
# What each step checks is at the top of its script in
# .github/service-managers/. Job logs need a login to read, so every failed
# check is also an error annotation (the command, its output, the unit or job
# state and the logs), and each step ends with a notice counting what passed.
#
# systemd runs on every push that changes more than documentation; launchd
# on pushes to main, pull requests and by hand (Actions > Service managers >
# Run workflow, on any branch). The runner is ubuntu-24.04, not -latest: that
# label moves to Ubuntu 26.04 (a new systemd, sudo and shell) between
# 2026-10-19 and 2026-11-19, and these checks should meet it on purpose.
name: Service managers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-managers-${{ github.ref }}
  # Never on main (see ci.yml): a docs-only push must not cancel a code commit's run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0"
  BUN_VERSION: "1.3.13"
  # The .deb check builds the package: keep in step with release.yml.
  NFPM_VERSION: "2.47.0"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: bash .github/code-changed.sh

  systemd:
    name: systemd (Ubuntu)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build warden (release)
        run: cargo build --release --bin warden
      # As a package or install.sh would: warden and bun where root's
      # secure_path (sudo) and systemd's default PATH find them.
      - name: Install warden and bun into /usr/local/bin
        run: |
          sudo install -m 755 target/release/warden /usr/local/bin/warden
          sudo install -m 755 "$(command -v bun)" /usr/local/bin/bun
          echo "PID 1: $(ps -p 1 -o comm=); $(systemctl --version | head -1); $(warden --version); bun $(bun --version)"
          test "$(ps -p 1 -o comm=)" = systemd
      - name: "systemd: root, system units"
        run: bash .github/service-managers/linux.sh system
      # The script ends with unstartup and kill; this only matters when it
      # did not get there (a root wardend.service would confuse the next step).
      - name: Clean up after root
        if: ${{ !cancelled() }}
        run: |
          sudo warden unstartup --system || true
          sudo warden kill --yes || true
      - name: "systemd: user units, lingering"
        if: ${{ !cancelled() }}
        run: bash .github/service-managers/linux.sh user

  # The same checks with warden installed from the .deb the Release workflow
  # publishes (docs/packages.md): installing it must start and enable nothing,
  # and `warden startup` must then write units that run /usr/bin/warden.
  systemd-deb:
    name: systemd (Ubuntu, .deb)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Build warden (release)
        run: cargo build --release --bin warden
      - name: Install nfpm
        run: |
          go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@v$NFPM_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the .deb and install it
        run: |
          set -euo pipefail
          version=$(target/release/warden --version | cut -d' ' -f2)
          mkdir -p notices pkg
          echo "(third-party notices are generated by the Release workflow)" > notices/THIRD-PARTY-LICENSES.txt
          bash scripts/dist-linux-packages.sh --no-gui --formats deb --no-sums --notices notices --out pkg target/release "$version" x86_64
          sudo apt-get install -y ./pkg/warden_*_amd64.deb
          # bun where root's secure_path (sudo) and systemd's default PATH find it.
          sudo install -m 755 "$(command -v bun)" /usr/local/bin/bun
          echo "PID 1: $(ps -p 1 -o comm=); $(systemctl --version | head -1); $(command -v warden): $(warden --version); bun $(bun --version)"
          test "$(command -v warden)" = /usr/bin/warden
          test "$(ps -p 1 -o comm=)" = systemd
      # A package installs files; `warden startup` is what sets a host up.
      - name: The package started and enabled nothing
        run: |
          for unit in warden@.service wardend.service; do
            if systemctl cat "$unit" > /dev/null 2>&1; then echo "::error::the package installed $unit"; exit 1; fi
          done
          test ! -e /etc/sysctl.d/99-warden.conf
          test ! -S /run/warden/wardend.sock
          ls /usr/share/doc/warden/examples
      - name: "systemd: root, system units (warden from the .deb)"
        run: WARDEN_BIN=/usr/bin/warden bash .github/service-managers/linux.sh system
      - name: Clean up after root
        if: ${{ !cancelled() }}
        run: |
          sudo warden unstartup --system || true
          sudo warden kill --yes || true
      - name: "systemd: user units, lingering (warden from the .deb)"
        if: ${{ !cancelled() }}
        run: WARDEN_BIN=/usr/bin/warden bash .github/service-managers/linux.sh user
      - name: Remove the package
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get remove -y warden
          test ! -e /usr/bin/warden
          test ! -e /usr/share/doc/warden

  launchd:
    name: launchd (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Node 22.12+ has reusePort on Linux only; the Node app checks that the
      # shim lets it listen on macOS anyway.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Build warden (release)
        run: cargo build --release --bin warden
      - name: Install warden and bun into /usr/local/bin
        run: |
          sudo mkdir -p /usr/local/bin
          sudo install -m 755 target/release/warden /usr/local/bin/warden
          sudo install -m 755 "$(command -v bun)" /usr/local/bin/bun
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(warden --version), bun $(bun --version)"
      - name: "launchd: LaunchAgent (user)"
        run: bash .github/service-managers/macos.sh agent
      - name: Clean up after the LaunchAgent
        if: ${{ !cancelled() }}
        run: |
          warden unstartup || true
          warden kill --yes || true
      - name: "launchd: LaunchDaemon (root)"
        if: ${{ !cancelled() }}
        run: bash .github/service-managers/macos.sh daemon
