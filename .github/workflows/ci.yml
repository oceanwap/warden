# Linux x86_64 and ARM64 are the production targets: everything runs there,
# integration tests included. macOS is for development: build, lint, unit tests.
#
# Linux x86_64 runs on every push and pull request; Linux ARM64 and macOS run
# on pushes to main, on pull requests and by hand (Actions > CI > Run
# workflow, on any branch), and only when something but documentation changed
# (.github/code-changed.sh), so a scratch branch or a docs-only commit does not
# wait for them. A docs-only commit still gets a green Linux x86_64 run, which
# is what `cargo release` and the Release workflow look for. (Hosted runners
# are free for a public repository: nothing here is rationed for cost. To try
# a branch on ARM64 or macOS, start CI by hand on it.)
#
# Runners are named (ubuntu-24.04), not `ubuntu-latest`: GitHub moves that
# label to Ubuntu 26.04 between 2026-10-19 and 2026-11-19, and the move should
# happen when someone has looked at a CI run on it, not by itself in the
# middle of a release. macOS follows `macos-latest`.
# The workspace also has protocol/ (the wire types) and gui/ (warden-gui):
# every job builds and lints all of it; the GUI's tests run in the gui job
# (unit, headless rendering with iced_test, and against a real wardend), next
# to linux-x86_64 rather than in it, so neither waits for the other.
#
# The integration tests run 12 at a time instead of one per CPU (4 on a hosted
# runner): most of each test is waiting for a process to start or stop, so
# this halves the step on Linux x86_64 (about 150 s to 75 s).
# Linux ARM64 runs 8 at a time: at 12, two tests that wait a second or a few
# for a supervisor to answer or exit timed out there (PR #28's first run). The
# static_perf tests stay at the default: they compare CPU time.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never on main: a docs-only push right after a code push would cancel the
  # code commit's run, and its own docs-only diff skips macOS and ARM64.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain Warden is developed with. Bump it on purpose: a new release
  # brings new clippy lints, and `-D warnings` turns them into failures.
  RUST_TOOLCHAIN: "1.95.0"
  # What the integration tests and the benchmarks run on.
  BUN_VERSION: "1.3.13"
  # The newest Bun, for the paths that need 1.4 (taking handed-over
  # connections, worker mode at full speed): the linux-bun-1-4 job. Bump it
  # on purpose too; the Bun canary workflow tries `latest` and `canary` daily.
  BUN_NEXT_VERSION: "1.4.2"
  NODE_VERSION: "22"
  ACTIONLINT_VERSION: "1.7.12"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: bash .github/code-changed.sh

  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      # bench/node_modules has the real PM2 that the pm2-migrate integration
      # test drives (without it that test skips).
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      # The proxy test (tests/integration.rs) runs an nginx of its own, on a
      # free port with its own config; it skips without it.
      - name: apt-get install nginx strace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nginx strace
      - run: cargo fmt --all --check
      - run: shellcheck install.sh install-gui.sh scripts/*.sh .github/code-changed.sh .github/release-notes.sh contrib/nfpm-preremove.sh contrib/nfpm-gui-preremove.sh
      # The macOS release script, with stubs for the Mac-only tools; and the
      # release tooling (xtask).
      - name: scripts/dist-macos.sh (stubbed) and xtask tests
        run: |
          bash scripts/test-dist-macos.sh
          cargo test -p xtask
      - name: scripts/test-install.sh (install.sh against fake releases)
        run: bash scripts/test-install.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --bin warden
        run: |
          set -o pipefail
          cargo test --bin warden 2>&1 | tee unit.log
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --test integration -- --test-threads=12 2>&1 | tee integration.log
      - name: cargo test --test static_perf
        if: ${{ !cancelled() }}
        env:
          WARDEN_REQUIRE_STRACE: "1"
        run: |
          set -o pipefail
          # strace attaches to the static workers the tests start, which are
          # not its children: Ubuntu's Yama (ptrace_scope 1) refuses that.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          cargo test --test static_perf 2>&1 | tee static_perf.log
      # Job logs need a login to read; annotations don't: name the failing
      # tests and their panic messages there.
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py unit.log integration.log static_perf.log

  # The GUI and protocol tests, on the same toolchain as linux-x86_64.
  gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The GUI's SSH test (gui/tests/ssh.rs) runs an sshd of its own, on a
      # free port with its own config; it skips without it.
      - name: apt-get install openssh-server
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends openssh-server
      # The GUI's integration test drives target/debug/warden.
      - name: GUI and protocol tests
        run: |
          set -o pipefail
          cargo build --bin warden
          cargo test -p warden-protocol -p warden-gui 2>&1 | tee gui.log
        env:
          WARDEN_GUI_SNAPSHOT_DIR: ${{ github.workspace }}/gui-snapshots
      - name: Upload the GUI's headless screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gui-snapshots
          path: gui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py gui.log

  # The workflow files themselves (and the shell in their `run:` steps, through
  # shellcheck). The Release workflow only ever runs for a release or a dry
  # run: a typo in it is found here, not on release day.
  workflows:
    name: workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"

  linux-arm64:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --bin warden
        run: |
          set -o pipefail
          cargo test --bin warden 2>&1 | tee unit.log
      - run: cargo test -p warden-protocol
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --test integration -- --test-threads=8 2>&1 | tee integration.log
      - name: cargo test --test static_perf
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --test static_perf 2>&1 | tee static_perf.log
      # Job logs need a login to read; annotations don't: one per failed
      # test, with its captured output.
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py unit.log integration.log static_perf.log

  # The integration tests again on the newest Bun: on 1.3.13 the shim takes
  # its pre-1.4 branches (no handed-over connections), so the 1.4 ones run
  # only here. Linux x86_64 only, when code changed.
  linux-bun-1-4:
    name: linux-x86_64 (newest Bun)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_NEXT_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - name: apt-get install nginx strace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends nginx strace
      - run: bun --version
      - name: cargo test --test integration
        run: |
          set -o pipefail
          cargo test --test integration -- --test-threads=12 2>&1 | tee integration.log
      - name: cargo test --test static_perf
        if: ${{ !cancelled() }}
        env:
          WARDEN_REQUIRE_STRACE: "1"
        run: |
          set -o pipefail
          sudo sysctl -w kernel.yama.ptrace_scope=0
          cargo test --test static_perf 2>&1 | tee static_perf.log
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py integration.log static_perf.log

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.ref == 'refs/heads/main' || github.event_name != 'push')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --bin warden
        run: |
          set -o pipefail
          cargo test --bin warden 2>&1 | tee unit.log
      - name: cargo test -p warden-protocol
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p warden-protocol 2>&1 | tee protocol.log
      # As on Linux: the failed tests, with their output, as annotations.
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py unit.log protocol.log
