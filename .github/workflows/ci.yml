# Linux x86_64 and ARM64 are the production targets: everything runs there,
# integration tests included. macOS is for development: build, lint, unit tests.
# The workspace also has protocol/ (the wire types) and gui/ (warden-gui):
# every job builds and lints all of it; the GUI's tests run on linux-x86_64
# (unit, headless rendering with iced_test, and against a real wardend).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain Warden is developed with. Bump it on purpose: a new release
  # brings new clippy lints, and `-D warnings` turns them into failures.
  RUST_TOOLCHAIN: "1.98.1"
  # What the integration tests and the benchmarks run on.
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "22"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      # bench/node_modules has the real PM2 that the pm2-migrate integration
      # test drives (without it that test skips).
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - run: cargo fmt --all --check
      - run: shellcheck install.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --bin warden
        run: |
          set -o pipefail
          cargo test --bin warden 2>&1 | tee unit.log
      # The GUI's integration test drives target/debug/warden.
      - name: GUI and protocol tests
        run: |
          set -o pipefail
          cargo build --bin warden
          cargo test -p warden-protocol -p warden-gui 2>&1 | tee gui.log
        env:
          WARDEN_GUI_SNAPSHOT_DIR: ${{ github.workspace }}/gui-snapshots
      - name: Upload the GUI's headless screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gui-snapshots
          path: gui-snapshots/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --test integration 2>&1 | tee integration.log
      # Job logs need a login to read; annotations don't: name the failing
      # tests and their panic messages there.
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py unit.log gui.log integration.log

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --bin warden
        run: |
          set -o pipefail
          cargo test --bin warden 2>&1 | tee unit.log
      - run: cargo test -p warden-protocol
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test --test integration 2>&1 | tee integration.log
      # Job logs need a login to read; annotations don't: one per failed
      # test, with its captured output.
      - name: annotate failing tests
        if: failure()
        run: python3 .github/annotate-test-failures.py unit.log integration.log

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --bin warden
      - run: cargo test -p warden-protocol
