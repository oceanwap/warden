# Linux x86_64 and ARM64 are the production targets: everything runs there,
# integration tests included. macOS is for development: build, lint, unit tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # -eo pipefail: a failing `cargo test | tee` fails the step.
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # The toolchain Warden is developed with. Bump it on purpose: a new release
  # brings new clippy lints, and `-D warnings` turns them into failures.
  RUST_TOOLCHAIN: "1.95.0"
  # What the integration tests and the benchmarks run on.
  BUN_VERSION: "1.3.13"
  NODE_VERSION: "22"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      # bench/node_modules has the real PM2 that the pm2-migrate integration
      # test drives (without it that test skips).
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --bin warden 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # The runner's own systemd service leaks INVOCATION_ID into every step,
      # and Warden would take that service for its own unit (`warden kill`
      # then goes through systemctl). Run as from a terminal.
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: env -u INVOCATION_ID cargo test --test integration 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # TEMPORARY: job logs need auth; surface failing tests as an annotation.
      - name: Annotate test failures
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/test.log" ] || exit 0
          python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import re, sys
          t = open(sys.argv[1], errors="replace").read()
          t = re.sub(r"\x1b\[[0-9;]*m", "", t)
          blocks = re.findall(r"\nfailures:\n(.*?)\nfailures:\n", t, re.S)
          out = "\n".join(blocks) or t[-6000:]
          out = out[:20000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=test failures::" + out)
          PY

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bench/package-lock.json
      - name: npm ci (bench/)
        working-directory: bench
        run: npm ci --no-audit --no-fund
      - run: cargo build --all-targets
      - run: cargo test --bin warden 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # The runner's own systemd service leaks INVOCATION_ID into every step,
      # and Warden would take that service for its own unit (`warden kill`
      # then goes through systemctl). Run as from a terminal.
      - name: cargo test --test integration
        if: ${{ !cancelled() }}
        run: env -u INVOCATION_ID cargo test --test integration 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # TEMPORARY: job logs need auth; surface failing tests as an annotation.
      - name: Annotate test failures
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/test.log" ] || exit 0
          python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import re, sys
          t = open(sys.argv[1], errors="replace").read()
          t = re.sub(r"\x1b\[[0-9;]*m", "", t)
          blocks = re.findall(r"\nfailures:\n(.*?)\nfailures:\n", t, re.S)
          out = "\n".join(blocks) or t[-6000:]
          out = out[:20000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=test failures::" + out)
          PY

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - run: cargo build
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --bin warden 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # TEMPORARY: job logs need auth; surface failing tests as an annotation.
      - name: Annotate test failures
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/test.log" ] || exit 0
          python3 - "$RUNNER_TEMP/test.log" <<'PY'
          import re, sys
          t = open(sys.argv[1], errors="replace").read()
          t = re.sub(r"\x1b\[[0-9;]*m", "", t)
          blocks = re.findall(r"\nfailures:\n(.*?)\nfailures:\n", t, re.S)
          out = "\n".join(blocks) or t[-6000:]
          out = out[:20000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=test failures::" + out)
          PY
