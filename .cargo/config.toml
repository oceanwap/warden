# Project commands (cargo aliases, not part of any build):
#   cargo xtask bench        run every benchmark, update README and bench/results/latest.md
#   cargo bench-all          the same
#   cargo xtask bench --help
#   cargo release 0.2.0      release: checks, version bump, tag, push, macOS archives (on a
#                            Mac), follow the Release workflow (cargo xtask release --help;
#                            docs/releasing.md)
#   cargo dist-macos         the macOS archives, built on this Mac, uploaded to the draft
#                            release (scripts/dist-macos.sh --help)
[alias]
xtask = "run --quiet --package xtask --"
bench-all = "run --quiet --package xtask -- bench"
release = "run --quiet --package xtask -- release"
dist-macos = "run --quiet --package xtask -- dist-macos"
