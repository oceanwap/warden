# cargo-about: the third-party notices shipped in every release archive
# (THIRD-PARTY-LICENSES*.txt, generated by .github/workflows/release.yml).
# `cargo about generate --locked --fail -m Cargo.toml about.hbs` for the CLI,
# `-m gui/Cargo.toml` for the GUI.

# Every license in the dependency tree must be one of these (all permissive);
# a new dependency under anything else fails the release until reviewed.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CC0-1.0",
]

# Every platform a release is built for, so platform-only crates are listed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Warden's own crates (publish = false) are under LICENSE-MIT / LICENSE-APACHE.
private = { ignore = true }

# Only what ships in the binaries.
ignore-dev-dependencies = true
ignore-build-dependencies = true
