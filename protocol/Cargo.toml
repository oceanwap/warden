[package]
name = "warden-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Warden's wire types (docs/protocol.md): what the control sockets and wardend speak, shared by the CLI and the GUI."
publish = false

# serde and serde_json only: the GUI and the daemon build against the same
# types, and this crate adds nothing else to either.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
