[package]
name = "warden"
version = "0.1.10"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oceanwap/warden"
# Released as binaries on GitHub, not on crates.io.
publish = false
description = "A small, boring supervisor for Bun/Node HTTP workers: SO_REUSEPORT, graceful drain, rolling reload."
rust-version = "1.85"

[workspace]
# protocol: the wire types (docs/protocol.md), shared by warden and the GUI.
# gui: the native GUI (warden-gui), a client of wardend.
# xtask: `cargo xtask bench` (see .cargo/config.toml). Plain `cargo build`,
# `cargo test` and `cargo install` in this directory still mean Warden only;
# `--workspace` (or `-p warden-gui`) takes in the rest.
members = ["protocol", "gui", "xtask"]

# The code standards CI enforces (`cargo clippy -- -D warnings`); see
# CONTRIBUTING.md. Every member opts in with `[lints] workspace = true`.
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
# Every `unsafe` block says why it is sound.
undocumented_unsafe_blocks = "warn"
unused_async = "warn"

[lints]
workspace = true

[dependencies]
libc = "0.2.189"
memchr = "2.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure Rust, no C: the background compression of static files (docs/static-serving.md).
brotli = { version = "9", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "signal", "net", "time", "io-util", "sync", "fs"] }
# The HTTP/2 adaptor's frames: `http` for messages, `bytes` for bodies.
http = "1"
bytes = "1"
# TLS + HTTP/2 for `[static]` sites behind the :443 router (or direct HTTPS):
# rustls (ring crypto: a C compiler builds it, no cmake needed), async
# adapter, and the H2 connection state machine. The plain-HTTP/1.1 path
# uses none of this and stays as it is.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
h2 = "0.4"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
warden-protocol = { path = "protocol" }
# `[tls]`: the ACME client (pure Rust on the same ring-based rustls), the
# placeholder certificate, and the certificate's validity dates.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
x509-parser = { version = "0.18", default-features = false }
time = { version = "0.3", default-features = false }

[dev-dependencies]
libc = "0.2.189"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# `cargo xtask profile`: the release build with its symbols (and line tables),
# so perf can name Warden's own functions. Not for shipping.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
