[package]
name = "warden"
version = "0.1.0"
edition = "2024"
description = "A small, boring supervisor for Bun/Node HTTP workers: SO_REUSEPORT, graceful drain, rolling reload."
rust-version = "1.85"

[workspace]
# protocol: the wire types (docs/protocol.md), shared by warden and the GUI.
# gui: the native GUI (warden-gui), a client of wardend.
# xtask: `cargo xtask bench` (see .cargo/config.toml). Plain `cargo build`,
# `cargo test` and `cargo install` in this directory still mean Warden only;
# `--workspace` (or `-p warden-gui`) takes in the rest.
members = ["protocol", "gui", "xtask"]

[dependencies]
libc = "0.2.189"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "signal", "net", "time", "io-util", "sync", "fs"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
warden-protocol = { path = "protocol" }

[dev-dependencies]
libc = "0.2.189"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
