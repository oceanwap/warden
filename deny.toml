# cargo-deny: `cargo deny check advisories sources bans` (.github/workflows/audit.yml).
# Licenses are checked by cargo-about at release time (about.toml).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# Unmaintained crates warn; vulnerabilities and yanked crates fail.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # tokio's AsyncFd::new/with_interest accept any AsRawFd. Every AsyncFd in
    # Warden wraps a descriptor it owns (File, TcpListener, UnixStream), so the
    # unsound case (closing or reusing the descriptor behind its back) cannot
    # arise. Moving to the unsafe `register` constructors touches the accept,
    # keeper and process paths: do it on purpose, then drop this entry.
    "RUSTSEC-2026-0386",
    # rustls-pemfile is unmaintained (its parser moved into rustls-pki-types),
    # with no vulnerability. Replace it when the TLS loading code is next
    # touched, then drop this entry.
    "RUSTSEC-2025-0134",
]

[sources]
# crates.io only: no git or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Duplicate versions (tokio and iced pull some) are not worth failing over.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true # path dependencies between workspace members
