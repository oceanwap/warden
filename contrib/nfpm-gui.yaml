# nfpm (https://nfpm.goreleaser.com) configuration for the `warden-gui`
# package: the GUI (/usr/bin/warden-gui, its menu entry and its icons) AND the
# CLI it runs on (/usr/bin/warden, the same files as the `warden` package, at
# the same paths: contrib/nfpm.yaml). One package gives a desktop everything,
# like the GUI tarball and the macOS app: the GUI talks to wardend through the
# `warden` binary, found next to it or on PATH.
#
# So warden-gui takes the place of warden: it provides warden (anything that
# needs warden is satisfied), and installing it removes the warden package
# (deb: Conflicts + Replaces, dpkg and apt remove warden in its favour; rpm:
# Obsoletes, dnf swaps them in one transaction; Arch: conflicts + replaces).
# Removing warden-gui removes the CLI too. Installing the warden package
# again removes warden-gui (a desktop that wants the CLI alone).
#
# Run by scripts/dist-linux-packages.sh, which sets:
#
#   ARCH, VERSION, RELEASE, MAINTAINER   as in contrib/nfpm.yaml; VERSION and
#                  RELEASE also make the versions in provides and replaces
#   BIN_DIR        holds the `warden` and `warden-gui` binaries
#   NOTICES_DIR    holds THIRD-PARTY-LICENSES.txt and THIRD-PARTY-LICENSES-GUI.txt
#
# The menu entry is assets/warden-gui.desktop, the icons assets/icon/ (the
# files the GUI tarball ships, too); change them there.
#
# glibc: the GUI is built on Ubuntu 22.04 (release.yml), so it may use
# glibc 2.35 symbols, and links nothing else but libgcc. winit and softbuffer
# load the display libraries when the window opens: libxkbcommon always, then
# Wayland's client and cursor libraries or X11's (README.md, Install). A
# shared-library scanner cannot see that, so they are Recommends (a desktop has
# them; a headless host that installs the GUI would see the window fail).
name: warden-gui
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: ${RELEASE}
section: x11
priority: optional
maintainer: ${MAINTAINER}
description: |
  Warden's GUI and CLI: every app on a host, monitored live from wardend.
  The window (warden-gui) and the `warden` command line in one package, which
  takes the place of the warden package. The window needs a desktop session
  (Wayland or X11); it draws on the CPU (no GPU driver) and can also reach a
  remote host over SSH (`warden-gui --ssh`).
homepage: https://github.com/oceanwap/warden
license: MIT OR Apache-2.0

contents:
  # ---- The CLI: what contrib/nfpm.yaml installs, path for path (the package
  # test checks that every one of its paths is here too). Keep them in step.
  - src: ${BIN_DIR}/warden
    dst: /usr/bin/warden
    expand: true
    file_info:
      mode: 0755

  - dst: /usr/share/doc/warden
    type: dir
    file_info:
      mode: 0755
  - dst: /usr/share/doc/warden/examples
    type: dir
    file_info:
      mode: 0755

  - src: LICENSE-MIT
    dst: /usr/share/doc/warden/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/doc/warden/LICENSE-APACHE
    file_info:
      mode: 0644
  - src: ${NOTICES_DIR}/THIRD-PARTY-LICENSES.txt
    dst: /usr/share/doc/warden/THIRD-PARTY-LICENSES.txt
    expand: true
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/warden/README.md
    file_info:
      mode: 0644

  - src: warden.example.toml
    dst: /usr/share/doc/warden/examples/warden.example.toml
    file_info:
      mode: 0644
  - src: contrib/wardend.service
    dst: /usr/share/doc/warden/examples/wardend.service
    file_info:
      mode: 0644
  - src: contrib/warden@.service
    dst: /usr/share/doc/warden/examples/warden@.service
    file_info:
      mode: 0644
  - src: contrib/99-warden.conf
    dst: /usr/share/doc/warden/examples/99-warden.conf
    file_info:
      mode: 0644
  - src: contrib/nginx.conf
    dst: /usr/share/doc/warden/examples/nginx.conf
    file_info:
      mode: 0644

  # ---- The GUI.
  - src: ${BIN_DIR}/warden-gui
    dst: /usr/bin/warden-gui
    expand: true
    file_info:
      mode: 0755

  - src: assets/warden-gui.desktop
    dst: /usr/share/applications/warden-gui.desktop
    file_info:
      mode: 0644

  # The desktop entry says Icon=warden; hicolor is the fallback theme every
  # desktop looks in. 1024 px is not a hicolor size: the PNGs stop at 512.
  - src: assets/icon/png/warden-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/png/warden-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/png/warden-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/png/warden-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/png/warden-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/png/warden-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/warden.png
    file_info:
      mode: 0644
  - src: assets/icon/warden.svg
    dst: /usr/share/icons/hicolor/scalable/apps/warden.svg
    file_info:
      mode: 0644

  # An rpm owns the directories it creates (a deb always does). The icon and
  # applications directories belong to hicolor-icon-theme and the desktop.
  - dst: /usr/share/doc/warden-gui
    type: dir
    file_info:
      mode: 0755

  - src: LICENSE-MIT
    dst: /usr/share/doc/warden-gui/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/doc/warden-gui/LICENSE-APACHE
    file_info:
      mode: 0644
  - src: ${NOTICES_DIR}/THIRD-PARTY-LICENSES-GUI.txt
    dst: /usr/share/doc/warden-gui/THIRD-PARTY-LICENSES-GUI.txt
    expand: true
    file_info:
      mode: 0644
  - src: gui/assets/fonts/LICENSES.txt
    dst: /usr/share/doc/warden-gui/FONT-LICENSES.txt
    file_info:
      mode: 0644
  - src: gui/README.md
    dst: /usr/share/doc/warden-gui/README.md
    file_info:
      mode: 0644

# Removing warden-gui removes /usr/bin/warden too: like the warden package's,
# its pre-removal note says what that leaves behind, and changes nothing.
scripts:
  preremove: contrib/nfpm-gui-preremove.sh

# Taking warden's place. VERSION-RELEASE is this package's own version, spelled
# for each format by the script (0.2.0~rc.1 in a deb and an rpm).
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - hicolor-icon-theme
    provides:
      - warden (= ${VERSION}-${RELEASE})
    conflicts:
      - warden
    replaces:
      - warden
    recommends:
      - libxkbcommon0
      - libwayland-client0
      - libwayland-cursor0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxkbcommon-x11-0
  rpm:
    depends:
      - glibc >= 2.35
      - hicolor-icon-theme
    provides:
      - warden = ${VERSION}-${RELEASE}
    # nfpm writes an rpm's replaces as Obsoletes: dnf removes the warden
    # package of this version or older when warden-gui is installed. No
    # Conflicts: Obsoletes is what lets dnf swap them.
    replaces:
      - warden <= ${VERSION}-${RELEASE}
    recommends:
      - libxkbcommon
      - libwayland-client
      - libwayland-cursor
      - libX11
      - libX11-xcb
      - libXcursor
      - libXi
      - libxkbcommon-x11
  archlinux:
    depends:
      - glibc
      - hicolor-icon-theme
    provides:
      - warden=${VERSION}-${RELEASE}
    conflicts:
      - warden
    replaces:
      - warden
    # Arch has no weak dependencies: optdepends is what pacman prints.
    # nfpm's archlinux packager does not take recommends.

rpm:
  buildhost: localhost

deb:
  compression: xz
  fields:
    Bugs: https://github.com/oceanwap/warden/issues
