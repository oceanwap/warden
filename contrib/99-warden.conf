# /etc/sysctl.d/99-warden.conf — apply with `sysctl --system`.
# With SO_REUSEPORT, connections queued on a listener that is closing are
# reset unless the kernel migrates them to another listener (Linux >= 5.14).
# Measured: 9-15 resets per worker-mode reload under load with 0, none with 1.
net.ipv4.tcp_migrate_req = 1
