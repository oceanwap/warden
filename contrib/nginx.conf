# nginx in front of an app that Warden runs: an http-context file.
#
#   cp contrib/nginx.conf /etc/nginx/conf.d/api.conf   # or sites-available/ + a link in sites-enabled/
#   # set the app's port (3000 below, twice), server_name, your WebSocket and
#   # SSE paths (/ws, /events), then:
#   nginx -t && systemctl reload nginx
#
# Warden runs every worker on ONE port (SO_REUSEPORT) and the kernel spreads
# connections over them, so nginx has one upstream address whatever the
# number of workers, and nothing changes here when you scale or deploy. A
# rolling restart (`warden reload`, `safe-reload`, `restart`) never closes
# the port: new workers join it before old ones leave, and each old worker
# drains: it answers requests on its open keep-alive connections with
# `Connection: close` for `[shutdown] drain_ms`, finishes what is in flight
# (up to `grace_period`), and ends WebSockets (close 1001) and SSE streams
# (a clean end) after `long_lived_timeout`, so their clients reconnect to new
# workers. docs/proxies.md has the timeouts that matter, and load balancers.

# WebSockets: pass the client's Upgrade (on any path); for every other
# request an empty Connection header, so connections to the workers are
# kept alive.
map $http_upgrade $warden_connection {
    default upgrade;
    ""      "";
}

upstream warden_api {
    # The app's port (`[app] port`). One address: the kernel balances.
    # max_fails=0: never take the port out (it is every worker; a failed
    # connection says nothing about the next one).
    server 127.0.0.1:3000 max_fails=0;
    # The same address once more, as a backup: nginx retries an idempotent
    # request whose connection failed (see proxy_next_upstream) over a new
    # connection, which the kernel gives to a worker that is not closing.
    # Without net.ipv4.tcp_migrate_req = 1 (contrib/99-warden.conf), a
    # connection queued on a closing worker's listener at that instant is
    # reset; with this line nginx retries it instead of answering 502.
    server 127.0.0.1:3000 max_fails=0 backup;

    # Keep connections to the workers open between requests (no TCP
    # handshake per request). Idle ones per nginx worker process.
    keepalive 32;
    # Shorter than the app's own idle timeout (Node's http server 5 s, Bun's
    # 10 s), so that nginx, not the app, closes an idle connection: otherwise
    # a request sent on it just as the app closes it fails (and is retried
    # only if it is idempotent).
    keepalive_timeout 4s;
    keepalive_requests 1000;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # TLS, unless it ends at a load balancer or Cloudflare in front:
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Behind a load balancer or Cloudflare: the client's address from their
    # X-Forwarded-For, trusted from their addresses only.
    # set_real_ip_from 10.0.0.0/8;        # the load balancer's subnet, or Cloudflare's ranges
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # Idle client connections: keep them longer than a load balancer in front
    # does, so it never sends a request on a connection nginx is closing.
    # 75 s (nginx's default) is longer than an AWS ALB's 60 s; behind GCP's
    # load balancer (600 s) use 620s; Cloudflare: see docs/proxies.md.
    keepalive_timeout 75s;

    client_max_body_size 10m;

    # What every location passes to the app. (A location that sets any
    # proxy_set_header of its own inherits none of these: keep them here.)
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $warden_connection;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Behind a load balancer that ends TLS, pass its scheme instead:
    # $http_x_forwarded_proto (and set_real_ip_from above).
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # The workers are on this machine: a connect that takes longer than this
    # is a port nobody listens on.
    proxy_connect_timeout 2s;

    # Retries. `error timeout` (nginx's default, written out): a request whose
    # connection failed or timed out before a response goes to the next
    # upstream entry, here the same port over a new connection. nginx never
    # sends a non-idempotent request (POST, PATCH, LOCK) twice once it went
    # out, unless `non_idempotent` is listed: it is not, on purpose. Never
    # add http_500 and the like: a request the app answered must not run twice.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    location / {
        proxy_pass http://warden_api;
        # The longest a response may pause; raise it for slow endpoints.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSockets (your app's paths). Idle sockets stay open up to the read
    # timeout: have the app or the client ping more often than that. In a
    # restart the old worker closes them with 1001 (Going Away), which
    # passes through; the client reconnects, to a new worker.
    location /ws {
        proxy_pass http://warden_api;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # When the worker closes a WebSocket, the client answers its close
        # frame; nginx must read that answer before closing, or the kernel
        # resets the connection instead of ending it (a browser may then
        # report the close as not clean). Seen in 2 of 13 test runs without
        # this line, never with it.
        lingering_close always;
    }

    # Server-Sent Events (your app's paths): every event goes out as it is
    # written. An app can also turn buffering off for one response with the
    # header `X-Accel-Buffering: no`, on any path. In a restart the old
    # worker ends the stream after its last complete event; EventSource
    # reconnects by itself (with Last-Event-ID), to a new worker.
    location /events {
        proxy_pass http://warden_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # For a load balancer's health check: the app's own health path (the
    # same `[health] path` Warden checks), answered by whichever worker the
    # kernel picks. It keeps answering through rolling restarts, so a
    # deploy never takes the host out of rotation; a broken app does.
    location = /health {
        proxy_pass http://warden_api;
        proxy_read_timeout 5s;
        access_log off;
    }
}
