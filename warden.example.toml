# Warden example config. Every key except [app] name and the command/entry is
# optional; values shown are the defaults unless marked "example".
# Validate with: warden check -c warden.toml

[app]
name = "travelerwe-api"                      # example; [A-Za-z0-9._-], not "all"
command = "bun"                              # process mode: the app (bun, node, python3, any program);
                                             # worker mode: the Bun binary that hosts the Workers
args = ["run", "dist/main.js"]               # example (process mode)
# entry = "dist/main.js"                     # worker mode: module each Worker imports
working_directory = "/srv/apps/travelerwe/api/current"   # example; relative = relative to this file
port = 3000                                  # example; sets PORT and enables readiness detection
env = { NODE_ENV = "production" }            # example
# env_file = "api.env"                       # example; KEY=value lines (dotenv / systemd EnvironmentFile), relative
                                             # to this file, read again by `warden reload`; keep secrets there (0600).
                                             # Workers get the supervisor's environment, then env_file, then env, then
                                             # Warden's variables (PORT, NODE_APP_INSTANCE, WARDEN_*): each wins over
                                             # the ones before. `warden env <app>` shows the result (docs/configuration.md:
                                             # "Environment variables")
# shim = true                                # default: true when command is bun or node (reusePort,
                                             # readiness, drain, health socket); false for anything else
# namespace = "backend"                      # example; a group for `warden restart backend` (default "default")
instance_var = "NODE_APP_INSTANCE"           # env var with the worker's 0-based index (PM2's instance_var); "" = none
pin_release = true                           # start workers in the real path of working_directory (its `current`
                                             # symlink resolved at start and at each reload / safe-reload / restart),
                                             # so a crash restart after the symlink swap stays on the running release

[workers]
count = 4                                    # example (default 1); also "max" (one per CPU) or "max-1"
mode = "process"                             # "process" (production) | "worker" (experimental, Bun Workers)
port_strategy = "shared"                     # "shared" (SO_REUSEPORT) | "offset" (PORT = port + i - 1)
ready_timeout = 30                           # s to start listening, else killed and counted as a crash
wait_ready = false                           # ready on process.send('ready') instead of listening (PM2's wait_ready)
min_uptime = 1000                            # ms an app without a port must stay up to count as ready
# overlap = true                             # start the new worker before stopping the old one in rolling
                                             # restarts (default: yes when the port can be shared)
standby = 0                                  # hot standbys: extra workers kept started (app initialized)
                                             # but not listening; when a worker dies one takes its slot in
                                             # a few ms instead of a cold start. Each costs about one
                                             # worker's memory. Process mode, shared port, bun/node shim

[restart]
enabled = true
max_restarts = 10                            # restarts allowed in restart_window...
restart_window = 60                          # ...seconds, then the worker is FAILED
backoff_initial = 100                        # ms before the 2nd crash-in-a-row restart (the 1st is
                                             # immediate), doubling per further crash
backoff_max = 10000                          # ms
failed_cooldown = 300                        # s before a FAILED worker is retried (0 = never)
# schedule = "0 3 * * *"                     # example; rolling restart on a cron schedule, local time (PM2's cron_restart)
stop_exit_codes = []                         # exit codes that mean "done, don't restart" (PM2's stop_exit_codes)

[shutdown]
grace_period = 30                            # s to exit after the stop signal before SIGKILL
drain_ms = 500                               # ms the shim keeps answering with Connection: close
signal = "SIGTERM"                           # or "SIGINT" for apps written for PM2 (its default)
long_lived_timeout = 2                       # s (fractions ok) a draining worker lets WebSockets and SSE streams
                                             # end by themselves, then closes them (1001 / end of stream) so clients
                                             # reconnect to new workers; below grace_period; 0 = leave them open

[health]
enabled = true                               # example (default false): periodic per-worker checks
path = "/health"                             # example; checked on each worker's private socket
# live_path = "/live"                        # example; "is this process OK": periodic checks (default: path)
# ready_path = "/ready"                      # example; "can it serve": rollout gates (default: path)
# url = "http://127.0.0.1:3000/health"       # optional app-level check through the shared port
interval = 5                                 # s
timeout = 2                                  # s
failure_threshold = 3                        # consecutive failures
initial_delay = 10                           # s after a worker is ready before periodic checks start
outage_threshold = 0.5                       # this share of workers failing at once = a dependency is down:
                                             # replacements are held (1.0 = off)
on_failure = "replace"                       # "replace" the worker gracefully | "log" | "reload" (app-level)

[reload]                                     # gates for every replacement (reload, safe-reload, restart N, recycling)
health_passes = 3                            # consecutive passes on the new worker's private socket
health_interval_ms = 500
# verify_command = "curl -sf --unix-socket \"$WARDEN_WORKER_SOCKET\" http://w/ready"   # example smoke test
min_ready = 0                                # s each new worker must stay healthy before taking over
canary_soak = 30                             # s the safe-reload canary runs next to the old worker
pause = 0                                    # s between workers (safe-reload)
# preflight = "bun run check:deploy"         # example; runs before anything is touched
timeout = 120                                # s allowed per worker for all gates
surge = 1                                    # new workers started at once, each next to the one it replaces:
                                             # 1, N or "all". The old ones drain once the whole batch passed the
                                             # gates; a failure stops the batch's new workers. Briefly runs up to
                                             # N extra workers (memory). Not with port_strategy = "offset"
max_draining = 4                             # old workers that may still be draining (closing WebSockets/SSE,
                                             # finishing requests) while the next ones are replaced; past that,
                                             # the next replacement waits for one to exit. Each holds its memory
                                             # until it exits: a rollout runs at most max(surge, max_draining)
                                             # extra processes. 1 = each old worker exits before the next starts

[watchdog]
timeout = 60                                 # s without an event-loop heartbeat = hung (0 = off)
loop_delay_warn = 0.5                        # s (fractions ok); warn when a worker's event-loop delay (p99, from the
                                             # shim's heartbeat; `warden list` column Loop) stays at least this high
                                             # for 10 s; at most once per 10 min per worker (0 = off)

[limits]
max_memory = 0                               # MB per worker process; recycle gracefully above it (0 = off)
max_lifetime = 0                             # s; recycle each worker after this, ±10% jitter (0 = off)

[watch]                                      # opt-in (PM2's watch): a gated rolling restart when files change.
                                             # For development and staging; production deploys use `warden
                                             # reload`. docs/watch.md has the details
enabled = false                              # true, or `warden start server.ts --watch`
paths = ["."]                                # directories or files, relative to working_directory (else where
                                             # Warden was started); absolute paths work too
ignore = ["node_modules", ".git", ".hg", ".svn", "*.log", "*.pid", "*.sock", "*.swp", "*.swx", "*~", ".DS_Store"]
                                             # never watched: a name or glob (* ? **) matches at any depth, a
                                             # pattern with a / is a path from working_directory, /abs/path is
                                             # absolute, a trailing / matches directories only. Setting `ignore`
                                             # replaces this list: keep node_modules and .git in it. Warden's own
                                             # log files and sockets are never watched
debounce_ms = 500                            # ms the files must stay unchanged before the restart starts (a build
                                             # writes many files); restarts are also spaced 2 s apart, up to 30 s
                                             # when files change again right after each one
interval_ms = 1000                           # ms between looks at the files (100-3600000); a slow scan stretches it
max_files = 10000                            # most files and directories looked at (1-100000); the rest is not
                                             # watched, and one warning says so

[logging]
level = "info"                               # debug | info | warn | error
# timestamps = true                          # default: off under journald (it adds its own)
worker_output = "capture"                    # "capture" (through Warden: prefixed, in `warden logs`, in files)
                                             # | "inherit" (workers write straight to Warden's stdout)
                                             # | "direct" (straight into out_file/err_file, see below)
max_lines_per_sec = 10000                    # worker output kept per worker and stream; the excess is counted
                                             # and dropped. 0 = keep every line (a flooding app is slowed instead)
                                             # (capture only)
# file = "/var/log/warden/api.log"           # example; everything, as `warden logs` shows it
# out_file = "/var/log/warden/api-out.log"   # example; worker stdout as written (PM2's out_file)
# err_file = "/var/log/warden/api-err.log"   # example; worker stderr as written (PM2's error_file)
per_worker_files = false                     # api-out-1.log, api-out-2.log… (PM2 without merge_logs)
file_timestamps = false                      # prefix out/err lines with a timestamp (PM2's `time`; capture only)
#
# `warden flush` empties all of these files that exist now (every worker's too), never the rotated ones;
# `warden logs --history` reads them back, rotated and .gz ones included, oldest first.
#
# worker_output = "direct" is for apps that log heavily and only need the files:
#   + the kernel moves the bytes from each worker's pipe into its file (splice): no parsing, no copy
#     through Warden, no line budget, no line lost; the file is byte for byte what the app wrote
#     (no prefix, no timestamp), rotated by [logging.rotate] at line boundaries (a rotated file ends
#     with the line that reached max_size; a line that never ends is cut once the file is
#     max_size + max(max_size, 1 MiB) long)
#   - nothing goes to stdout/journald or into memory. `warden logs` reads the tails of the files
#     (stamped with the file's last write time, since lines carry none) and `-f` follows new lines;
#     `tail -f` works as always. A slow disk slows the app's writes (as if it wrote the file itself)
#     instead of dropping lines
#   needs out_file. stderr goes to err_file, or into out_file (like `2>&1`, in the order written)
#   when err_file is unset. Several worker processes (workers.count > 1 in process mode) need
#   per_worker_files = true: each worker's bytes arrive unparsed, and in one shared file a partial
#   line of one could meet another's. Filesystems without splice work too, copied through Warden
#   (one warning says so).

[logging.rotate]                             # every log file above; built in, no logrotate needed
max_size = "10M"                             # rotate at this size ("500K", "1G"; 0 = only on interval)
keep = 5                                     # rotated files kept per log file
# interval = "0 0 * * *"                     # example; also rotate on a cron schedule (local time)
compress = false                             # gzip rotated files (read back by `warden logs --history`)
date_suffix = false                          # api.log.2026-09-30T00-00-00 instead of api.log.1
max_age_days = 0                             # also delete rotated files older than this (0 = off)

[metrics]
# listen = "127.0.0.1:9464"                  # Prometheus text at /metrics

[control]
socket = "/run/warden/travelerwe-api/control.sock"   # example; RuntimeDirectory=warden/%i in the unit

# A static site instead of an app (what `warden serve <dir> <port>` writes).
# Workers are Warden's own file server: no command needed, process mode.
# [static]
# root = "/srv/site/current/dist"            # example; a `current` symlink is resolved per worker start
# host = "0.0.0.0"
# spa = false                                # unknown paths get index.html (single-page apps)
# index = "index.html"
# cache_max_age = 3600                       # s; HTML is revalidated (see html_max_age), fingerprinted names cached a year
# html_max_age = 60                          # example; opt in: browsers reuse a page for 60 s without asking (default: unset,
#                                            # `no-cache`: a 304 round trip per page load). A deploy shows up after this long,
#                                            # so keep it short; max 31536000 (a year); 0 = always revalidate
# listing = false                            # HTML listing for directories without an index
# dotfiles = false                           # serve dotfiles (.well-known is always served)
# precompressed = true                       # serve file.br / file.gz when the client accepts them
# basic_auth = "user:password"               # example; keep the config file private (0600)
# headers = { "X-Frame-Options" = "DENY" }   # example; extra response headers
# access_log = false                         # one stdout line per request
# cache_size = 0                             # per worker: prebuilt responses of small files in memory, e.g. "16MB".
#                                            # Off by default, like nginx: files come from the OS page cache on
#                                            # every request, about as fast. Bodies of 8 KB and up are kept in
#                                            # memfds and sent with sendfile (one descriptor each, at most 1/8 of
#                                            # the open-files limit)
# cache_max_file = "64KB"                    # with a cache: larger files are not cached (sent with sendfile)
# cache_valid_ms = 1000                      # with a cache: a cached file is re-checked on disk at most this often
